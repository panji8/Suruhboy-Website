<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CCTV System - Multi Camera</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a1a;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 15px;
        }
        
        /* Header */
        .header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 15px 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .header h1 {
            font-size: 1.8em;
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .header-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }
        
        .status-dot.online { background: #4CAF50; }
        .status-dot.recording { background: #ff4444; animation: pulse 0.5s infinite; }
        .status-dot.offline { background: #666; animation: none; }
        
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        
        /* Layout */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 15px;
        }
        
        /* Video Grid */
        .video-grid-container {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .video-grid-container .header-grid {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .video-grid-container .header-grid h3 {
            color: #ffd700;
            font-size: 1.1em;
        }
        
        .view-controls {
            display: flex;
            gap: 8px;
        }
        
        .view-controls .btn {
            padding: 5px 12px;
            border: none;
            border-radius: 6px;
            font-size: 0.8em;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(255,255,255,0.1);
            color: white;
        }
        
        .view-controls .btn.active {
            background: #2196F3;
            color: white;
        }
        
        .view-controls .btn:hover {
            transform: scale(1.05);
        }
        
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 10px;
        }
        
        .video-grid.view-1 { grid-template-columns: 1fr; }
        .video-grid.view-2 { grid-template-columns: 1fr 1fr; }
        .video-grid.view-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
        .video-grid.view-6 { grid-template-columns: 1fr 1fr 1fr; }
        
        .video-item {
            position: relative;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            aspect-ratio: 16/9;
            border: 2px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
        }
        
        .video-item.active {
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255,215,0,0.2);
        }
        
        .video-item video, .video-item canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .video-item .camera-info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 3px 12px;
            border-radius: 15px;
            font-size: 0.75em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .video-item .camera-info .rec-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #ff4444;
            display: none;
            animation: pulse 0.5s infinite;
        }
        
        .video-item .camera-info .rec-dot.active {
            display: inline-block;
        }
        
        .video-item .camera-controls {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 5px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .video-item:hover .camera-controls {
            opacity: 1;
        }
        
        .camera-controls .btn-sm {
            padding: 4px 8px;
            border: none;
            border-radius: 4px;
            font-size: 0.7em;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-sm.record {
            background: #ff4444;
            color: white;
        }
        
        .btn-sm.record.active {
            background: #ff8800;
            animation: pulse 0.5s infinite;
        }
        
        .btn-sm.screenshot {
            background: #2196F3;
            color: white;
        }
        
        .btn-sm.fullscreen {
            background: #9c27b0;
            color: white;
        }
        
        /* Motion Detection Overlay */
        .motion-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .motion-box {
            position: absolute;
            border: 2px solid #ff4444;
            background: rgba(255,68,68,0.1);
            animation: blink 0.5s ease;
        }
        
        @keyframes blink {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }
        
        /* Side Panel */
        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .panel {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .panel h3 {
            color: #ffd700;
            font-size: 1em;
            margin-bottom: 10px;
        }
        
        /* Camera List */
        .camera-list {
            max-height: 200px;
            overflow-y: auto;
        }
        
        .camera-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            margin-bottom: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .camera-item:hover {
            background: rgba(255,255,255,0.1);
        }
        
        .camera-item.active {
            border-left: 3px solid #ffd700;
        }
        
        .camera-item .cam-name {
            font-size: 0.85em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .camera-item .cam-status {
            font-size: 0.7em;
            padding: 2px 8px;
            border-radius: 10px;
        }
        
        .cam-status.online { background: #4CAF50; color: white; }
        .cam-status.offline { background: #666; color: white; }
        .cam-status.recording { background: #ff4444; color: white; animation: pulse 1s infinite; }
        
        /* Recording List */
        .recording-list {
            max-height: 150px;
            overflow-y: auto;
        }
        
        .recording-item {
            padding: 5px 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
            margin-bottom: 3px;
            font-size: 0.8em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .recording-item .del-btn {
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 2px 8px;
            cursor: pointer;
            font-size: 0.7em;
        }
        
        /* Controls */
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-size: 0.85em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        
        .btn:hover {
            transform: scale(1.05);
        }
        
        .btn:active {
            transform: scale(0.95);
        }
        
        .btn-primary { background: #2196F3; color: white; }
        .btn-success { background: #4CAF50; color: white; }
        .btn-danger { background: #f44336; color: white; }
        .btn-warning { background: #ff9800; color: white; }
        .btn-purple { background: #9c27b0; color: white; }
        .btn-sm { padding: 4px 10px; font-size: 0.75em; }
        
        .control-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        
        /* QR Code */
        #qrCode {
            display: flex;
            justify-content: center;
            padding: 10px;
            background: white;
            border-radius: 10px;
            min-height: 120px;
            align-items: center;
        }
        
        .room-code {
            text-align: center;
            padding: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            font-size: 1em;
            letter-spacing: 2px;
            font-family: monospace;
            margin-top: 10px;
        }
        
        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
            max-width: 90%;
        }
        
        .toast.success { border-left: 4px solid #4CAF50; }
        .toast.error { border-left: 4px solid #f44336; }
        .toast.info { border-left: 4px solid #2196F3; }
        .toast.warning { border-left: 4px solid #ff9800; }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        /* Responsive */
        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            
            .video-grid {
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            }
        }
        
        @media (max-width: 768px) {
            .video-grid.view-2,
            .video-grid.view-4,
            .video-grid.view-6 {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 1.3em;
            }
        }
        
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #ffd700;
            border-radius: 10px;
        }
        
        /* Fullscreen video */
        .video-item.fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            border-radius: 0;
            aspect-ratio: unset;
        }
        
        .video-item.fullscreen .camera-controls {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>
                <span>🎥 CCTV System</span>
                <span style="font-size: 0.5em; -webkit-text-fill-color: #666;">
                    <span class="status-dot online" id="statusDot"></span>
                    <span id="statusText">Online</span>
                </span>
            </h1>
            <div class="header-controls">
                <button class="btn btn-success btn-sm" onclick="addCamera()">➕ Tambah Kamera</button>
                <button class="btn btn-primary btn-sm" onclick="toggleRecording()">
                    <span id="recBtnText">⏺ Record All</span>
                </button>
                <button class="btn btn-warning btn-sm" onclick="takeScreenshot()">📸 Screenshot</button>
                <button class="btn btn-purple btn-sm" onclick="toggleFullscreen()">⛶ Fullscreen</button>
            </div>
        </div>
        
        <!-- Main Grid -->
        <div class="main-grid">
            <!-- Video Grid -->
            <div class="video-grid-container">
                <div class="header-grid">
                    <h3>📹 Live Feed</h3>
                    <div class="view-controls">
                        <button class="btn active" onclick="setView('auto')" data-view="auto">Auto</button>
                        <button class="btn" onclick="setView('1')" data-view="1">1</button>
                        <button class="btn" onclick="setView('2')" data-view="2">2</button>
                        <button class="btn" onclick="setView('4')" data-view="4">4</button>
                        <button class="btn" onclick="setView('6')" data-view="6">6</button>
                    </div>
                </div>
                <div class="video-grid view-auto" id="videoGrid">
                    <div style="grid-column: 1/-1; text-align: center; padding: 50px; color: #666;">
                        <div style="font-size: 3em; margin-bottom: 10px;">📹</div>
                        <p>Belum ada kamera terhubung</p>
                        <p style="font-size: 0.85em; margin-top: 5px;">Klik "Tambah Kamera" atau scan QR Code</p>
                    </div>
                </div>
            </div>
            
            <!-- Side Panel -->
            <div class="side-panel">
                <!-- Connection Panel -->
                <div class="panel">
                    <h3>🔗 Connect Camera</h3>
                    <div id="qrCode">
                        <div style="color: #666; text-align: center; padding: 10px;">
                            <div style="font-size: 2em;">📲</div>
                            <p style="font-size: 0.8em;">Generate QR untuk connect</p>
                        </div>
                    </div>
                    <div class="room-code" id="roomCodeDisplay">Room: ---</div>
                    <div class="control-group">
                        <button class="btn btn-success btn-sm" onclick="generateQR()">🔄 Generate QR</button>
                        <button class="btn btn-info btn-sm" onclick="copyRoomCode()">📋 Copy</button>
                        <button class="btn btn-primary btn-sm" onclick="addCamera()">📱 Manual</button>
                    </div>
                </div>
                
                <!-- Camera List -->
                <div class="panel">
                    <h3>📷 Camera List (<span id="cameraCount">0</span>)</h3>
                    <div class="camera-list" id="cameraList">
                        <div style="text-align: center; opacity: 0.5; padding: 15px; font-size: 0.85em;">
                            Belum ada kamera
                        </div>
                    </div>
                </div>
                
                <!-- Recording List -->
                <div class="panel">
                    <h3>💾 Recordings (<span id="recordingCount">0</span>)</h3>
                    <div class="recording-list" id="recordingList">
                        <div style="text-align: center; opacity: 0.5; padding: 15px; font-size: 0.85em;">
                            Belum ada recording
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <script>
        // ============================================
        // STATE
        // ============================================
        const state = {
            cameras: [],
            recordings: [],
            roomCode: 'CCTV-' + Math.random().toString(36).substr(2, 6).toUpperCase(),
            isRecording: false,
            currentView: 'auto',
            selectedCamera: null
        };
        
        let qrCodeInstance = null;
        let broadcastChannel = null;
        let deviceId = 'CCTV-' + Math.random().toString(36).substr(2, 4).toUpperCase();
        let recordingInterval = null;
        let frameIntervals = {};
        let cameraIdCounter = 0;
        
        // ============================================
        // INIT
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            initializeCCTV();
        });
        
        function initializeCCTV() {
            generateQR();
            initializeBroadcast();
            loadRecordings();
            updateUI();
            
            // Auto-add demo camera
            setTimeout(() => {
                addDemoCamera('Camera 1 (Depan)');
                setTimeout(() => addDemoCamera('Camera 2 (Belakang)'), 1000);
                setTimeout(() => addDemoCamera('Camera 3 (Samping)'), 2000);
            }, 500);
            
            console.log('🎥 CCTV System initialized');
            console.log('🔑 Room Code:', state.roomCode);
        }
        
        // ============================================
        // BROADCAST CHANNEL
        // ============================================
        function initializeBroadcast() {
            try {
                broadcastChannel = new BroadcastChannel('cctv_' + state.roomCode);
                broadcastChannel.onmessage = function(event) {
                    handleBroadcastMessage(event.data);
                };
                console.log('📡 Broadcast Channel ready');
            } catch (e) {
                console.error('Broadcast error:', e);
                window.addEventListener('storage', function(event) {
                    if (event.key === 'cctv_' + state.roomCode) {
                        try {
                            handleBroadcastMessage(JSON.parse(event.newValue));
                        } catch (e) {}
                    }
                });
            }
        }
        
        function broadcastUpdate(data) {
            const message = {
                type: 'update',
                cameras: state.cameras.map(c => ({ id: c.id, name: c.name, active: c.active })),
                deviceId: deviceId,
                timestamp: Date.now(),
                ...data
            };
            
            try {
                if (broadcastChannel) {
                    broadcastChannel.postMessage(message);
                }
                localStorage.setItem('cctv_' + state.roomCode, JSON.stringify(message));
            } catch (e) {}
        }
        
        function handleBroadcastMessage(data) {
            if (data.deviceId === deviceId) return;
            
            if (data.type === 'camera_frame' && data.cameraId) {
                // Tampilkan frame dari camera lain
                const camera = state.cameras.find(c => c.id === data.cameraId);
                if (camera) {
                    displayFrame(data.cameraId, data.frame);
                }
            }
            
            if (data.type === 'camera_connect') {
                // Camera baru dari client
                const newCam = {
                    id: data.cameraId,
                    name: data.cameraName || 'Camera ' + data.cameraId,
                    active: true,
                    isRemote: true
                };
                
                if (!state.cameras.find(c => c.id === newCam.id)) {
                    state.cameras.push(newCam);
                    addCameraElement(newCam);
                    updateUI();
                    showToast(`📷 ${newCam.name} terhubung`, 'success');
                }
            }
        }
        
        // ============================================
        // CAMERA MANAGEMENT
        // ============================================
        function addCamera() {
            const name = prompt('Nama Camera:', 'Camera ' + (state.cameras.length + 1));
            if (name) {
                const camera = {
                    id: 'CAM-' + (++cameraIdCounter),
                    name: name,
                    active: true,
                    isRemote: false
                };
                
                state.cameras.push(camera);
                addCameraElement(camera);
                updateUI();
                
                // Jika mode client, mulai stream
                if (state.isClientMode) {
                    startLocalCamera(camera.id);
                }
                
                broadcastUpdate({ type: 'camera_connect', cameraId: camera.id, cameraName: camera.name });
                showToast(`📷 ${camera.name} ditambahkan`, 'success');
            }
        }
        
        function addDemoCamera(name) {
            const camera = {
                id: 'CAM-DEMO-' + (++cameraIdCounter),
                name: name,
                active: true,
                isRemote: false,
                isDemo: true
            };
            
            state.cameras.push(camera);
            addCameraElement(camera);
            updateUI();
            
            // Simulasi stream
            simulateCameraStream(camera.id);
            
            showToast(`📷 ${camera.name} terhubung (demo)`, 'info');
        }
        
        function removeCamera(cameraId) {
            if (confirm('Hapus camera ini?')) {
                state.cameras = state.cameras.filter(c => c.id !== cameraId);
                const element = document.querySelector(`[data-camera-id="${cameraId}"]`);
                if (element) element.remove();
                updateUI();
                showToast('Camera dihapus', 'info');
                
                if (frameIntervals[cameraId]) {
                    clearInterval(frameIntervals[cameraId]);
                    delete frameIntervals[cameraId];
                }
            }
        }
        
        function addCameraElement(camera) {
            const grid = document.getElementById('videoGrid');
            
            // Hapus placeholder jika ada
            const placeholder = grid.querySelector('[style*="grid-column: 1/-1"]');
            if (placeholder && state.cameras.length === 1) {
                placeholder.remove();
            }
            
            const div = document.createElement('div');
            div.className = 'video-item';
            div.dataset.cameraId = camera.id;
            
            // Canvas untuk menampilkan frame
            const canvas = document.createElement('canvas');
            canvas.id = 'cam_' + camera.id;
            div.appendChild(canvas);
            
            // Camera info
            const info = document.createElement('div');
            info.className = 'camera-info';
            info.innerHTML = `
                <span class="rec-dot" id="recDot_${camera.id}"></span>
                <span>${camera.name}</span>
                <span style="font-size:0.8em; opacity:0.6;" id="fps_${camera.id}">0 fps</span>
            `;
            div.appendChild(info);
            
            // Controls
            const controls = document.createElement('div');
            controls.className = 'camera-controls';
            controls.innerHTML = `
                <button class="btn-sm record" onclick="toggleCameraRecording('${camera.id}')" id="recBtn_${camera.id}">⏺</button>
                <button class="btn-sm screenshot" onclick="takeCameraScreenshot('${camera.id}')">📸</button>
                <button class="btn-sm fullscreen" onclick="toggleCameraFullscreen('${camera.id}')">⛶</button>
                <button class="btn-sm" style="background:#f44336;color:white;" onclick="removeCamera('${camera.id}')">✕</button>
            `;
            div.appendChild(controls);
            
            // Click to select
            div.addEventListener('click', function(e) {
                if (!e.target.closest('.camera-controls')) {
                    selectCamera(camera.id);
                }
            });
            
            grid.appendChild(div);
            updateView();
        }
        
        function selectCamera(cameraId) {
            state.selectedCamera = cameraId;
            
            // Update UI
            document.querySelectorAll('.video-item').forEach(el => {
                el.classList.toggle('active', el.dataset.cameraId === cameraId);
            });
            
            document.querySelectorAll('.camera-item').forEach(el => {
                el.classList.toggle('active', el.dataset.cameraId === cameraId);
            });
        }
        
        // ============================================
        // DISPLAY FRAME
        // ============================================
        function displayFrame(cameraId, imageData) {
            const canvas = document.getElementById('cam_' + cameraId);
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            const img = new Image();
            img.onload = function() {
                const container = canvas.parentElement;
                const rect = container.getBoundingClientRect();
                const ratio = img.width / img.height;
                let w = rect.width || 320;
                let h = w / ratio;
                if (h > rect.height) {
                    h = rect.height || 240;
                    w = h * ratio;
                }
                canvas.width = w;
                canvas.height = h;
                ctx.drawImage(img, 0, 0, w, h);
            };
            img.src = imageData;
        }
        
        // ============================================
        // SIMULATE CAMERA STREAM (DEMO)
        // ============================================
        function simulateCameraStream(cameraId) {
            // Buat animasi random untuk demo
            const canvas = document.getElementById('cam_' + cameraId);
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            let frameCount = 0;
            let fpsCounter = 0;
            let lastFpsUpdate = Date.now();
            
            frameIntervals[cameraId] = setInterval(() => {
                const container = canvas.parentElement;
                const rect = container.getBoundingClientRect();
                const w = rect.width || 320;
                const h = rect.height || 240;
                canvas.width = w;
                canvas.height = h;
                
                // Generate random content
                const gradient = ctx.createRadialGradient(
                    w/2 + Math.sin(frameCount * 0.01) * 50,
                    h/2 + Math.cos(frameCount * 0.015) * 50,
                    10,
                    w/2, h/2, w/2
                );
                gradient.addColorStop(0, `hsl(${frameCount % 360}, 70%, 50%)`);
                gradient.addColorStop(0.5, `hsl(${(frameCount + 60) % 360}, 70%, 30%)`);
                gradient.addColorStop(1, '#000');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, w, h);
                
                // Text
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.font = '20px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('📹 LIVE', w/2, h/2);
                
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.font = '12px Arial';
                ctx.fillText(new Date().toLocaleTimeString(), w/2, h/2 + 30);
                
                // Draw random motion dots
                for (let i = 0; i < 10; i++) {
                    const x = Math.random() * w;
                    const y = Math.random() * h;
                    const r = Math.random() * 5 + 2;
                    ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.3})`;
                    ctx.beginPath();
                    ctx.arc(x, y, r, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                frameCount++;
                fpsCounter++;
                
                // Update FPS
                const now = Date.now();
                if (now - lastFpsUpdate > 1000) {
                    const fps = document.getElementById('fps_' + cameraId);
                    if (fps) fps.textContent = fpsCounter + ' fps';
                    fpsCounter = 0;
                    lastFpsUpdate = now;
                }
            }, 100);
        }
        
        // ============================================
        // LOCAL CAMERA (Client Mode)
        // ============================================
        async function startLocalCamera(cameraId) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: 640, height: 480 },
                    audio: false
                });
                
                const video = document.createElement('video');
                video.srcObject = stream;
                video.autoplay = true;
                video.muted = true;
                video.style.display = 'none';
                document.body.appendChild(video);
                
                // Kirim frame ke server
                const canvas = document.createElement('canvas');
                canvas.width = 320;
                canvas.height = 240;
                const ctx = canvas.getContext('2d');
                
                frameIntervals[cameraId] = setInterval(() => {
                    if (video.videoWidth > 0) {
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        const imageData = canvas.toDataURL('image/jpeg', 0.6);
                        
                        broadcastUpdate({
                            type: 'camera_frame',
                            cameraId: cameraId,
                            frame: imageData
                        });
                    }
                }, 100);
                
                showToast('📹 Camera aktif', 'success');
                
            } catch (err) {
                console.error('Camera error:', err);
                showToast('❌ Gagal akses kamera: ' + err.message, 'error');
            }
        }
        
        // ============================================
        // QR CODE
        // ============================================
        function generateQR() {
            const qrContainer = document.getElementById('qrCode');
            qrContainer.innerHTML = '';
            
            const clientUrl = window.location.href.split('?')[0] + 
                '?mode=client&room=' + state.roomCode;
            
            try {
                qrCodeInstance = new QRCode(qrContainer, {
                    text: clientUrl,
                    width: 150,
                    height: 150,
                    colorDark: '#000000',
                    colorLight: '#ffffff',
                    correctLevel: QRCode.CorrectLevel.H
                });
                document.getElementById('roomCodeDisplay').textContent = 'Room: ' + state.roomCode;
                showToast('QR Code siap! Scan untuk connect', 'success');
            } catch (e) {
                qrContainer.innerHTML = '<div style="color:#666;">Error generate QR</div>';
            }
        }
        
        function copyRoomCode() {
            const clientUrl = window.location.href.split('?')[0] + 
                '?mode=client&room=' + state.roomCode;
            navigator.clipboard.writeText(clientUrl).then(() => {
                showToast('Link disalin!', 'success');
            });
        }
        
        // ============================================
        // VIEW CONTROLS
        // ============================================
        function setView(view) {
            state.currentView = view;
            
            document.querySelectorAll('.view-controls .btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.view === view);
            });
            
            updateView();
        }
        
        function updateView() {
            const grid = document.getElementById('videoGrid');
            grid.className = 'video-grid view-' + state.currentView;
            
            // Auto adjust
            if (state.currentView === 'auto') {
                const count = state.cameras.length;
                if (count <= 1) grid.className = 'video-grid view-1';
                else if (count <= 2) grid.className = 'video-grid view-2';
                else if (count <= 4) grid.className = 'video-grid view-4';
                else grid.className = 'video-grid view-6';
            }
        }
        
        // ============================================
        // RECORDING
        // ============================================
        function toggleRecording() {
            state.isRecording = !state.isRecording;
            document.getElementById('recBtnText').textContent = state.isRecording ? '⏹ Stop' : '⏺ Record All';
            document.getElementById('statusDot').className = 'status-dot ' + (state.isRecording ? 'recording' : 'online');
            document.getElementById('statusText').textContent = state.isRecording ? 'Recording...' : 'Online';
            
            if (state.isRecording) {
                startRecording();
            } else {
                stopRecording();
            }
            
            // Update semua camera
            document.querySelectorAll('.rec-dot').forEach(dot => {
                dot.classList.toggle('active', state.isRecording);
            });
        }
        
        function toggleCameraRecording(cameraId) {
            const btn = document.getElementById('recBtn_' + cameraId);
            const isActive = btn.classList.toggle('active');
            
            if (isActive) {
                btn.textContent = '⏹';
                btn.style.background = '#ff8800';
                showToast(`⏺ Recording ${getCameraName(cameraId)}`, 'warning');
            } else {
                btn.textContent = '⏺';
                btn.style.background = '#ff4444';
                showToast(`⏹ Stop recording ${getCameraName(cameraId)}`, 'info');
            }
        }
        
        function startRecording() {
            // Simulasi recording
            if (recordingInterval) clearInterval(recordingInterval);
            
            recordingInterval = setInterval(() => {
                // Simulasi save frame
                const timestamp = new Date().toLocaleString();
                state.recordings.push({
                    id: 'REC-' + Date.now(),
                    name: 'Recording ' + (state.recordings.length + 1),
                    timestamp: timestamp,
                    size: (Math.random() * 10 + 1).toFixed(1) + ' MB'
                });
                
                updateRecordingList();
                showToast(`💾 Recording saved: ${timestamp}`, 'info');
            }, 5000);
        }
        
        function stopRecording() {
            if (recordingInterval) {
                clearInterval(recordingInterval);
                recordingInterval = null;
            }
        }
        
        function deleteRecording(id) {
            state.recordings = state.recordings.filter(r => r.id !== id);
            updateRecordingList();
            showToast('Recording dihapus', 'info');
        }
        
        // ============================================
        // SCREENSHOT
        // ============================================
        function takeScreenshot() {
            const cameraId = state.selectedCamera || (state.cameras[0]?.id);
            if (!cameraId) {
                showToast('Pilih camera dulu', 'error');
                return;
            }
            takeCameraScreenshot(cameraId);
        }
        
        function takeCameraScreenshot(cameraId) {
            const canvas = document.getElementById('cam_' + cameraId);
            if (!canvas) {
                showToast('Camera tidak aktif', 'error');
                return;
            }
            
            const link = document.createElement('a');
            link.download = `screenshot_${getCameraName(cameraId)}_${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            
            showToast(`📸 Screenshot ${getCameraName(cameraId)} diambil`, 'success');
        }
        
        // ============================================
        // FULLSCREEN
        // ============================================
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
                showToast('⛶ Fullscreen mode', 'info');
            } else {
                if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
            }
        }
        
        function toggleCameraFullscreen(cameraId) {
            const item = document.querySelector(`[data-camera-id="${cameraId}"]`);
            if (item) {
                item.classList.toggle('fullscreen');
                if (item.classList.contains('fullscreen')) {
                    showToast('⛶ Camera fullscreen', 'info');
                }
            }
        }
        
        // ============================================
        // UI UPDATE
        // ============================================
        function updateUI() {
            document.getElementById('cameraCount').textContent = state.cameras.length;
            updateCameraList();
            updateView();
            
            if (state.cameras.length > 0 && !state.selectedCamera) {
                selectCamera(state.cameras[0].id);
            }
        }
        
        function updateCameraList() {
            const list = document.getElementById('cameraList');
            
            if (state.cameras.length === 0) {
                list.innerHTML = `
                    <div style="text-align: center; opacity: 0.5; padding: 15px; font-size: 0.85em;">
                        Belum ada kamera
                    </div>
                `;
                return;
            }
            
            list.innerHTML = state.cameras.map(cam => `
                <div class="camera-item ${state.selectedCamera === cam.id ? 'active' : ''}" 
                     data-camera-id="${cam.id}"
                     onclick="selectCamera('${cam.id}')">
                    <span class="cam-name">
                        <span>📷</span>
                        ${cam.name}
                    </span>
                    <span class="cam-status ${cam.active ? 'online' : 'offline'}">
                        ${cam.active ? '● Online' : '● Offline'}
                    </span>
                </div>
            `).join('');
        }
        
        function updateRecordingList() {
            const list = document.getElementById('recordingList');
            document.getElementById('recordingCount').textContent = state.recordings.length;
            
            if (state.recordings.length === 0) {
                list.innerHTML = `
                    <div style="text-align: center; opacity: 0.5; padding: 15px; font-size: 0.85em;">
                        Belum ada recording
                    </div>
                `;
                return;
            }
            
            list.innerHTML = state.recordings.slice(-10).reverse().map(rec => `
                <div class="recording-item">
                    <span>${rec.name} (${rec.timestamp})</span>
                    <span>
                        ${rec.size}
                        <button class="del-btn" onclick="deleteRecording('${rec.id}')">✕</button>
                    </span>
                </div>
            `).join('');
        }
        
        function getCameraName(cameraId) {
            const cam = state.cameras.find(c => c.id === cameraId);
            return cam ? cam.name : 'Unknown';
        }
        
        // ============================================
        // SAVE / LOAD RECORDINGS
        // ============================================
        function loadRecordings() {
            try {
                const saved = localStorage.getItem('cctv_recordings');
                if (saved) {
                    state.recordings = JSON.parse(saved);
                    updateRecordingList();
                }
            } catch (e) {}
        }
        
        function saveRecordings() {
            try {
                localStorage.setItem('cctv_recordings', JSON.stringify(state.recordings));
            } catch (e) {}
        }
        
        // Auto save recordings
        setInterval(saveRecordings, 10000);
        
        // ============================================
        // TOAST
        // ============================================
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
        
        // ============================================
        // KEYBOARD SHORTCUTS
        // ============================================
        document.addEventListener('keydown', function(e) {
            if (e.target.tagName === 'INPUT') return;
            
            switch(e.key) {
                case 'r': toggleRecording(); break;
                case 's': takeScreenshot(); break;
                case 'f': toggleFullscreen(); break;
                case 'a': addCamera(); break;
                case '1': setView('1'); break;
                case '2': setView('2'); break;
                case '3': setView('4'); break;
                case '4': setView('6'); break;
                case ' ': e.preventDefault(); 
                    const next = state.cameras.find(c => c.id !== state.selectedCamera);
                    if (next) selectCamera(next.id);
                    break;
            }
        });
        
        // ============================================
        // CHECK CLIENT MODE
        // ============================================
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('mode') === 'client') {
            state.isClientMode = true;
            state.roomCode = urlParams.get('room') || state.roomCode;
            document.getElementById('roomCodeDisplay').textContent = 'Mode: Client - ' + state.roomCode;
            showToast('📱 Mode Client - Menghubungkan...', 'info');
            
            // Auto add camera as client
            setTimeout(() => {
                addCamera();
            }, 1000);
        }
        
        console.log('🎥 CCTV System siap!');
        console.log('📌 Shortcuts: R=Record S=Screenshot F=Fullscreen A=Add Camera 1-4=View');
    </script>
</body>
</html>
