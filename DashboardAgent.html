<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>SuruhBoy - Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #F7F9FC;
            min-height: 100vh;
        }

        /* Login Page */
        .login-page {
            min-height: 100vh;
            background: linear-gradient(145deg, #0A0C10 0%, #12161C 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1000;
        }

        .login-card {
            background: white;
            border-radius: 40px;
            width: 100%;
            max-width: 360px;
            padding: 40px 28px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        }

        .login-header { text-align: center; margin-bottom: 32px; }
        .login-icon {
            width: 70px; height: 70px;
            background: linear-gradient(135deg, #FF6B4A, #FF3B2F);
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 36px;
        }
        .login-header h1 { font-size: 28px; font-weight: 800; color: #0F172A; }
        .login-header p { color: #64748B; font-size: 14px; margin-top: 4px; }

        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: #F8FAFE;
            border: 1px solid #E2E8F0;
            border-radius: 20px;
            font-size: 15px;
            font-family: inherit;
        }
        .form-group input:focus {
            outline: none;
            border-color: #FF6B4A;
            box-shadow: 0 0 0 3px rgba(255,107,74,0.1);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #FF6B4A, #FF3B2F);
            border: none;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            cursor: pointer;
        }
        .btn-login:active { transform: scale(0.98); }

        .message {
            padding: 12px;
            border-radius: 20px;
            margin-bottom: 20px;
            font-size: 13px;
            text-align: center;
        }
        .info { background: #EFF6FF; color: #1E40AF; }
        .success { background: #DCFCE7; color: #15803D; }
        .error { background: #FEE2E2; color: #B91C1C; }

        .hidden { display: none; }

        /* Admin Dashboard */
        .admin-dashboard { max-width: 800px; margin: 0 auto; padding: 20px 16px 100px; }
        
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .logo-area h2 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #FF6B4A, #FF3B2F);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-area p { font-size: 12px; color: #94A3B8; }
        .user-menu { display: flex; align-items: center; gap: 12px; }
        .user-avatar {
            width: 48px; height: 48px;
            background: linear-gradient(135deg, #FF6B4A, #FF3B2F);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            color: white;
        }
        .logout-icon {
            width: 44px; height: 44px;
            background: #F1F5F9;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748B;
            cursor: pointer;
        }
        .logout-icon:active { background: #E2E8F0; transform: scale(0.95); }

        .admin-title { margin-bottom: 20px; }
        .admin-title h2 { font-size: 24px; font-weight: 700; color: #0F172A; }
        .admin-title p { color: #64748B; }

        .stats-card {
            background: white;
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #EDF2F7;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stats-card .total {
            font-size: 32px;
            font-weight: 800;
            color: #FF6B4A;
        }
        .refresh-btn {
            background: #F1F5F9;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .refresh-btn:active { transform: scale(0.96); background: #E2E8F0; }

        .agent-list-card {
            background: white;
            border-radius: 28px;
            padding: 20px;
            border: 1px solid #EDF2F7;
        }

        .agent-item-admin {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid #F1F5F9;
            position: relative;
        }
        .agent-item-admin:last-child { border-bottom: none; }
        .agent-info h4 { font-size: 16px; font-weight: 700; color: #0F172A; }
        .agent-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-online { background: #DCFCE7; color: #15803D; }
        .agent-areas { font-size: 12px; color: #64748B; margin-top: 4px; }
        .agent-last-active { font-size: 11px; color: #94A3B8; margin-top: 2px; }
        
        /* Burger Menu */
        .burger-menu {
            position: relative;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 40px;
            transition: background 0.2s;
            background: #F8FAFE;
        }
        .burger-menu:hover { background: #E2E8F0; }
        .burger-icon {
            font-size: 18px;
            color: #64748B;
        }
        .dropdown-menu {
            position: absolute;
            right: 0;
            top: 45px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.15);
            min-width: 170px;
            z-index: 1000;
            overflow: hidden;
            display: none;
            border: 1px solid #E2E8F0;
        }
        .dropdown-menu.show { display: block; }
        .dropdown-item {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 13px;
            color: #334155;
        }
        .dropdown-item:hover { background: #F8FAFE; }
        .dropdown-item i { width: 20px; color: #FF6B4A; }

        /* Modal Assign */
        .assign-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .assign-modal-content {
            background: white;
            border-radius: 32px;
            width: 100%;
            max-width: 380px;
            padding: 24px;
        }
        .assign-modal-content h3 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .assign-modal-content p {
            font-size: 14px;
            color: #64748B;
            margin-bottom: 20px;
        }
        .area-check-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
            max-height: 300px;
            overflow-y: auto;
        }
        .area-check {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .area-check input { width: 18px; height: 18px; accent-color: #FF6B4A; cursor: pointer; }
        .area-check span { font-size: 14px; color: #334155; cursor: pointer; }
        .modal-buttons {
            display: flex;
            gap: 12px;
        }
        .btn-assign-confirm {
            flex: 2;
            background: linear-gradient(135deg, #FF6B4A, #FF3B2F);
            border: none;
            padding: 12px;
            border-radius: 40px;
            font-weight: 600;
            color: white;
            cursor: pointer;
        }
        .btn-assign-cancel {
            flex: 1;
            background: #F1F5F9;
            border: none;
            padding: 12px;
            border-radius: 40px;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94A3B8;
        }
        .empty-state i { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }

        .loading-small { text-align: center; padding: 40px; color: #94A3B8; }
    </style>
</head>
<body>
    <!-- Login Page -->
    <div id="loginPage" class="login-page">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon">🤖</div>
                <h1>SuruhBoy</h1>
                <p>Admin Dashboard</p>
            </div>
            <div class="login-content">
                <div id="loginStatus" class="message info">⏳ Menghubungkan ke database...</div>
                <form id="loginForm">
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="username" placeholder="Masukkan username" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="password" placeholder="Masukkan password" required>
                    </div>
                    <button type="submit" class="btn-login">Masuk sebagai Admin</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="adminDashboard" class="admin-dashboard hidden">
        <div class="dashboard-header">
            <div class="logo-area">
                <h2>SuruhBoy Admin</h2>
                <p>Monitor Agent Online</p>
            </div>
            <div class="user-menu">
                <div class="user-avatar" id="adminAvatar">👤</div>
                <div class="logout-icon" onclick="logout()"><i class="fas fa-sign-out-alt"></i></div>
            </div>
        </div>

        <div class="admin-title">
            <h2>👥 Agent Online</h2>
            <p>Daftar agent yang sedang aktif dan siap kerja</p>
        </div>

        <div class="stats-card">
            <div>
                <span style="color:#64748B; font-size:14px;">Total Agent Online</span>
                <div class="total" id="totalOnline">0</div>
            </div>
            <button class="refresh-btn" onclick="refreshData()">
                <i class="fas fa-sync-alt"></i> Refresh
            </button>
        </div>

        <div class="agent-list-card">
            <div id="adminAgentList" class="agent-list">
                <div class="loading-small"><i class="fas fa-spinner fa-pulse"></i> Memuat data agent online...</div>
            </div>
        </div>
    </div>

    <!-- Modal Assign Area (Admin) -->
    <div id="assignModal" class="assign-modal">
        <div class="assign-modal-content">
            <h3><i class="fas fa-map-marker-alt"></i> Assign Area</h3>
            <p id="assignAgentName">Pilih area untuk agent</p>
            <div class="area-check-group" id="assignAreaList"></div>
            <div class="modal-buttons">
                <button class="btn-assign-confirm" onclick="confirmAssign()">Assign</button>
                <button class="btn-assign-cancel" onclick="closeAssignModal()">Batal</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // KONFIGURASI
        // ============================================
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyEyzeBKEsP_6PuAJDnuFmeqq0LBNNnIs97fnfQ6HZ_dpiUgrX9wdD0LNvbSyMKw0l06g/exec';
        const SPREADSHEET_ID_LOGIN = '1FgWiv56J2w7A0WprwqOKJMU7BO4mX3jotW3IC397rWg';
        
        // Sheet Online Log (gid 1931290882)
        const AGENT_STATUS_GID = '1931290882';
        const AGENT_STATUS_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID_LOGIN}/gviz/tq?tqx=out:json&gid=${AGENT_STATUS_GID}`;
        
        const LOGIN_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID_LOGIN}/gviz/tq?tqx=out:json&sheet=Sheet1`;
        
        const KECAMATAN = ["Ampel","Andong","Banyudono","Boyolali Kota","Cepogo","Juwangi","Karanggede","Kemusu","Klego","Mojosongo","Musuk","Ngemplak","Nogosari","Sambi","Sawit","Selo","Simo","Tamansari","Teras","Wonosegoro"];
        
        let users = [];
        let currentUser = null;
        let isAdmin = false;
        let onlineAgents = [];
        let selectedAgentForAssign = null;
        
        // ============================================
        // SAVE ONLINE LOG
        // ============================================
        async function saveOnlineLog(namaAgent, username, action, areas) {
            try {
                const params = new URLSearchParams();
                params.append('type', 'online');
                params.append('timestamp', new Date().toLocaleString('id-ID'));
                params.append('namaAgent', namaAgent);
                params.append('username', username);
                params.append('action', action);
                params.append('areas', areas || '-');
                await fetch(`${WEB_APP_URL}?${params.toString()}`, { method: 'GET', mode: 'no-cors' });
                console.log(`✅ Log saved: ${action} for ${namaAgent}`);
                return true;
            } catch(e) { 
                console.warn('Gagal kirim log:', e);
                return false;
            }
        }
        
        // ============================================
        // LOAD AGENT STATUS DARI SHEET
        // ============================================
        async function loadAgentStatusFromSheet() {
            try {
                console.log('Fetching agent status from Online Log sheet...');
                const response = await fetch(AGENT_STATUS_URL);
                const text = await response.text();
                const jsonString = text.match(/({.*})/)[1];
                const data = JSON.parse(jsonString);
                const rows = data.table.rows;
                const cols = data.table.cols;
                
                // Cari index kolom
                let timestampIdx = 0, namaAgentIdx = 1, usernameIdx = 2, actionIdx = 3, areasIdx = 4;
                for (let i = 0; i < cols.length; i++) {
                    const label = cols[i].label?.toLowerCase() || '';
                    if (label === 'timestamp') timestampIdx = i;
                    if (label === 'nama agent' || label === 'nama_agent') namaAgentIdx = i;
                    if (label === 'username') usernameIdx = i;
                    if (label === 'action') actionIdx = i;
                    if (label === 'areas') areasIdx = i;
                }
                
                const allStatus = [];
                for (let i = 0; i < rows.length; i++) {
                    const row = rows[i].c;
                    if (!row) continue;
                    
                    const timestamp = row[timestampIdx]?.v || '';
                    const namaAgent = row[namaAgentIdx]?.v || '';
                    const username = row[usernameIdx]?.v || '';
                    const action = row[actionIdx]?.v || '';
                    let areas = row[areasIdx]?.v || '';
                    
                    if (namaAgent && username && action) {
                        let areasArray = [];
                        if (areas) {
                            try {
                                areasArray = areas.startsWith('[') ? JSON.parse(areas) : areas.split(',').map(a => a.trim()).filter(a => a);
                            } catch(e) { areasArray = areas.split(',').map(a => a.trim()).filter(a => a); }
                        }
                        allStatus.push({ timestamp, namaAgent: String(namaAgent), username: String(username), action: String(action).toLowerCase(), areas: areasArray });
                    }
                }
                
                // Ambil status terbaru per agent (hanya yang online)
                const latestPerAgent = new Map();
                allStatus.forEach(status => {
                    const existing = latestPerAgent.get(status.username);
                    if (!existing || status.timestamp > existing.timestamp) {
                        latestPerAgent.set(status.username, status);
                    }
                });
                
                onlineAgents = [];
                for (const [username, status] of latestPerAgent) {
                    if (status.action === 'online' || status.action === 'available') {
                        onlineAgents.push({
                            username: status.username,
                            namaAgent: status.namaAgent,
                            areas: status.areas,
                            lastActive: status.timestamp
                        });
                    }
                }
                
                onlineAgents.sort((a, b) => new Date(b.lastActive) - new Date(a.lastActive));
                console.log(`Found ${onlineAgents.length} online agents`);
                return true;
            } catch(error) {
                console.error('Error loading agent status:', error);
                return false;
            }
        }
        
        // ============================================
        // LOAD USERS
        // ============================================
        async function loadUsers() {
            const statusDiv = document.getElementById('loginStatus');
            try {
                const response = await fetch(LOGIN_URL);
                const text = await response.text();
                const jsonString = text.match(/({.*})/)[1];
                const data = JSON.parse(jsonString);
                const rows = data.table.rows, cols = data.table.cols;
                let nameIdx = 0, usernameIdx = 1, passwordIdx = 2;
                for (let i = 0; i < cols.length; i++) {
                    const label = cols[i].label?.toLowerCase() || '';
                    if (label === 'user' || label === 'nama') nameIdx = i;
                    if (label === 'username') usernameIdx = i;
                    if (label === 'password') passwordIdx = i;
                }
                users = [];
                for (let i = 0; i < rows.length; i++) {
                    const row = rows[i].c;
                    if (!row) continue;
                    const name = row[nameIdx]?.v || '';
                    const username = row[usernameIdx]?.v || '';
                    const password = row[passwordIdx]?.v || '';
                    if (username && password && username !== 'Username') {
                        users.push({ name: String(name), username: String(username).toLowerCase(), password: String(password) });
                    }
                }
                statusDiv.innerHTML = '✅ Siap login';
                statusDiv.className = 'message success';
            } catch(error) {
                statusDiv.innerHTML = '❌ Gagal mengambil data login';
                statusDiv.className = 'message error';
            }
        }
        
        function login(username, password) {
            return users.find(u => u.username === username.toLowerCase() && u.password === password);
        }
        
        function isAdminUser(user) {
            return user.username === 'admin' || user.name === 'Admin Suruhboy' || user.username === 'adminsuruhboy';
        }
        
        // ============================================
        // RENDER AGENT LIST
        // ============================================
        function renderAgentList() {
            const container = document.getElementById('adminAgentList');
            const totalSpan = document.getElementById('totalOnline');
            
            totalSpan.innerText = onlineAgents.length;
            
            if (onlineAgents.length === 0) {
                container.innerHTML = `<div class="empty-state"><i class="fas fa-user-clock"></i><div>Tidak ada agent yang sedang online</div></div>`;
                return;
            }
            
            container.innerHTML = onlineAgents.map((agent, idx) => {
                const areas = agent.areas?.length ? agent.areas.join(', ') : '-';
                const lastActive = agent.lastActive ? new Date(agent.lastActive).toLocaleString('id-ID') : '-';
                const uniqueId = `dropdown_${idx}_${Date.now()}`;
                
                return `
                    <div class="agent-item-admin" id="agent_${idx}">
                        <div class="agent-info">
                            <h4><i class="fas fa-user-circle"></i> ${escapeHtml(agent.namaAgent)}</h4>
                            <div class="agent-areas"><i class="fas fa-map-marker-alt"></i> Area: ${escapeHtml(areas)}</div>
                            <div class="agent-last-active"><i class="fas fa-clock"></i> Online sejak: ${escapeHtml(lastActive)}</div>
                        </div>
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <span class="agent-status status-online"><i class="fas fa-circle"></i> Online</span>
                            <div class="burger-menu" onclick="showDropdown(event, '${uniqueId}', '${escapeHtml(agent.namaAgent)}', '${escapeHtml(agent.username)}', '${JSON.stringify(agent.areas).replace(/'/g, "\\'")}')">
                                <i class="fas fa-ellipsis-v burger-icon"></i>
                            </div>
                            <div id="${uniqueId}" class="dropdown-menu">
                                <div class="dropdown-item" onclick="offlineAgentAction('${escapeHtml(agent.namaAgent)}', '${escapeHtml(agent.username)}')">
                                    <i class="fas fa-power-off"></i> Offline-kan Agent
                                </div>
                                <div class="dropdown-item" onclick="openAssignModalAction('${escapeHtml(agent.namaAgent)}', '${escapeHtml(agent.username)}', ${JSON.stringify(agent.areas)})">
                                    <i class="fas fa-map-marker-alt"></i> Assign Area
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        // ============================================
        // GLOBAL FUNCTIONS UNTUK ADMIN ACTIONS
        // ============================================
        window.showDropdown = function(event, dropdownId, agentName, agentUsername, areasStr) {
            event.stopPropagation();
            // Tutup semua dropdown
            document.querySelectorAll('.dropdown-menu').forEach(menu => {
                if (menu.id !== dropdownId) {
                    menu.classList.remove('show');
                }
            });
            const dropdown = document.getElementById(dropdownId);
            if (dropdown) {
                dropdown.classList.toggle('show');
            }
        };
        
        window.offlineAgentAction = async function(agentName, agentUsername) {
            if (confirm(`Offline-kan agent ${agentName}?`)) {
                const success = await saveOnlineLog(agentName, agentUsername, 'Offline (by admin)', '-');
                if (success) {
                    localStorage.setItem(`suruhboy_agent_status_${agentUsername}`, JSON.stringify({
                        status: 'offline', areas: [], timestamp: new Date().toISOString(), forcedByAdmin: true
                    }));
                    await refreshData();
                    alert(`✅ Agent ${agentName} telah di-offline-kan`);
                } else {
                    alert('❌ Gagal mengirim data');
                }
            }
        };
        
        window.openAssignModalAction = function(agentName, agentUsername, currentAreas) {
            selectedAgentForAssign = { name: agentName, username: agentUsername, areas: currentAreas || [] };
            const modal = document.getElementById('assignModal');
            const areaList = document.getElementById('assignAreaList');
            document.getElementById('assignAgentName').innerHTML = `Assign area untuk <strong>${escapeHtml(agentName)}</strong>`;
            
            areaList.innerHTML = KECAMATAN.map(k => `
                <label class="area-check">
                    <input type="checkbox" value="${k}" ${(currentAreas || []).includes(k) ? 'checked' : ''}>
                    <span>${k}</span>
                </label>
            `).join('');
            
            modal.style.display = 'flex';
        };
        
        window.closeAssignModal = function() {
            document.getElementById('assignModal').style.display = 'none';
            selectedAgentForAssign = null;
        };
        
        window.confirmAssign = async function() {
            if (!selectedAgentForAssign) return;
            
            const selected = [];
            document.querySelectorAll('#assignAreaList input:checked').forEach(cb => selected.push(cb.value));
            
            const action = selected.length > 0 ? 'Online (assigned by admin)' : 'Offline (assigned by admin)';
            const areasText = selected.length > 0 ? selected.join(', ') : '-';
            
            const success = await saveOnlineLog(selectedAgentForAssign.name, selectedAgentForAssign.username, action, areasText);
            if (success) {
                localStorage.setItem(`suruhboy_agent_status_${selectedAgentForAssign.username}`, JSON.stringify({
                    status: selected.length > 0 ? 'available' : 'offline',
                    areas: selected,
                    timestamp: new Date().toISOString(),
                    assignedByAdmin: true
                }));
                await refreshData();
                closeAssignModal();
                alert(`✅ Area untuk ${selectedAgentForAssign.name} telah diupdate`);
            } else {
                alert('❌ Gagal mengupdate area');
            }
        };
        
        // ============================================
        // REFRESH DATA
        // ============================================
        async function refreshData() {
            const container = document.getElementById('adminAgentList');
            container.innerHTML = '<div class="loading-small"><i class="fas fa-spinner fa-pulse"></i> Memperbarui data...</div>';
            const success = await loadAgentStatusFromSheet();
            if (success) renderAgentList();
            else container.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><div>Gagal memuat data</div></div>';
        }
        
        // Tutup dropdown saat klik di luar
        document.addEventListener('click', function() {
            document.querySelectorAll('.dropdown-menu').forEach(menu => menu.classList.remove('show'));
        });
        
        // ============================================
        // DASHBOARD & LOGIN
        // ============================================
        function updateAdminUI() {
            if (!currentUser) return;
            document.getElementById('adminAvatar').innerText = currentUser.name.charAt(0).toUpperCase();
        }
        
        async function showAdminDashboard() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('adminDashboard').classList.remove('hidden');
            updateAdminUI();
            await refreshData();
            
            if (window.adminRefreshInterval) clearInterval(window.adminRefreshInterval);
            window.adminRefreshInterval = setInterval(() => {
                if (isAdmin && !document.getElementById('loginPage').classList.contains('hidden') === false) refreshData();
            }, 15000);
        }
        
        async function logout() {
            if (window.adminRefreshInterval) clearInterval(window.adminRefreshInterval);
            currentUser = null;
            isAdmin = false;
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('adminDashboard').classList.add('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const found = login(username, password);
            
            if (found && isAdminUser(found)) {
                currentUser = found;
                isAdmin = true;
                showAdminDashboard();
            } else if (found) {
                alert('⚠️ Akun ini bukan admin.');
            } else {
                alert('❌ Login gagal!');
            }
        });
        
        loadUsers();
    </script>
</body>
</html>
