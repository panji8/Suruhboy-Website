<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SuruhBoy — Dashboard Tracking</title>
<meta name="description" content="Dashboard tracking pengunjung website SuruhBoy.">

<!-- ===== Favicon ===== -->
<link rel="icon" type="image/x-icon" href="favicon/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
<link rel="manifest" href="favicon/site.webmanifest">

<!-- ===== PWA ===== -->
<meta name="theme-color" content="#0f2a4a">
<meta name="apple-mobile-web-app-title" content="SuruhBoy Admin">
<meta name="application-name" content="SuruhBoy Admin">
<meta name="robots" content="noindex, nofollow">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0f2a4a;--navy-soft:#1e3a5f;--orange:#ff7a1a;--orange-soft:#fff2e8;
  --bg:#fafbfc;--line:#eaeef3;--muted:#7a8899;--text:#0f2a4a;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
a{text-decoration:none;color:inherit}
.wrap{max-width:960px;margin:0 auto;padding:40px 20px}

/* ===== TOP BAR ===== */
.topbar{
  display:flex;justify-content:space-between;align-items:center;
  gap:16px;margin-bottom:24px;flex-wrap:wrap;
}
.back{
  color:var(--muted);font-size:13px;text-decoration:none;
  display:inline-flex;align-items:center;gap:6px;
  transition:color .2s;
}
.back:hover{color:var(--orange)}

.brand-mini{
  display:flex;align-items:center;gap:8px;
  font-weight:700;font-size:14px;color:var(--navy);
}
.brand-mini-dot{
  width:28px;height:28px;border-radius:8px;
  background:var(--navy);overflow:hidden;
  display:grid;place-items:center;flex-shrink:0;
}
.brand-mini-dot img{width:100%;height:100%;object-fit:contain;padding:3px}
.brand-mini span{color:var(--orange)}

/* ===== PAGE HEADER ===== */
.page-header{
  display:flex;align-items:center;gap:20px;
  margin-bottom:24px;
}
.page-logo{
  width:64px;height:64px;border-radius:18px;
  background:var(--navy);overflow:hidden;
  display:grid;place-items:center;flex-shrink:0;
  box-shadow:0 10px 24px rgba(15,42,74,.15);
}
.page-logo img{width:100%;height:100%;object-fit:contain;padding:10px}
.page-title h1{font-size:28px;font-weight:800;letter-spacing:-.5px;margin-bottom:2px}
.page-title h1 span{color:var(--orange)}
.page-title .sub{color:var(--muted);font-size:14px}

@media (min-width:1024px){
  .page-logo{width:76px;height:76px;border-radius:22px;padding:12px}
  .page-title h1{font-size:34px}
  .page-title .sub{font-size:15px}
}
@media (max-width:600px){
  .page-header{gap:14px}
  .page-logo{width:52px;height:52px;border-radius:14px;padding:8px}
  .page-title h1{font-size:22px}
  .page-title .sub{font-size:12.5px}
}

/* ===== REFRESH ===== */
.refresh{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--navy);color:#fff;padding:10px 20px;
  border-radius:99px;font-size:13px;font-weight:600;
  cursor:pointer;border:0;transition:all .2s;margin-bottom:28px;
}
.refresh:hover{background:var(--navy-soft)}
.refresh i{transition:transform .4s}
.refresh.spin i{animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ===== KPI CARDS ===== */
.kpis{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:14px;margin-bottom:24px;
}
.k{
  background:#fff;border:1px solid var(--line);
  border-radius:18px;padding:20px;transition:all .25s;
}
.k:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(29,78,96,.08)}
.k span{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
.k b{
  font-size:26px;font-weight:800;color:var(--navy);
  letter-spacing:-1px;display:block;line-height:1.2;
}
.k .trend{font-size:11px;color:var(--muted);margin-top:4px}

/* ===== CARDS ===== */
.card{
  background:#fff;border:1px solid var(--line);
  border-radius:20px;padding:24px;margin-bottom:20px;
}
.card h3{font-size:15px;font-weight:700;margin-bottom:16px}
.chart-wrap{position:relative;height:260px}

/* ===== TABLES ===== */
table{width:100%;border-collapse:collapse;font-size:14px}
th{
  text-align:left;color:var(--muted);font-weight:600;
  font-size:12px;padding:10px;border-bottom:2px solid var(--line);
}
td{padding:12px 10px;border-bottom:1px solid var(--line)}
td b{font-weight:600}
tr:last-child td{border:0}
.rank{
  width:28px;height:28px;border-radius:8px;background:var(--bg);
  display:inline-grid;place-items:center;
  font-size:12px;font-weight:700;color:var(--navy);
}
.rank.r1{background:var(--orange);color:#fff}

/* ===== STATE ===== */
.loading{text-align:center;padding:60px 20px;color:var(--muted)}
.loading i{font-size:32px;color:var(--orange);margin-bottom:12px;display:block}
.error{
  background:#fef2f2;border:1px solid #fecaca;color:#dc2626;
  padding:16px;border-radius:12px;font-size:14px;line-height:1.6;
}
.error b{display:block;margin-bottom:4px}
.error code{
  background:rgba(220,38,38,.08);padding:2px 6px;
  border-radius:4px;font-size:12px;
  font-family:monospace;
}

/* ===== TWO COLUMN ===== */
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:700px){.two{grid-template-columns:1fr}}

/* ===== FOOTER NOTE ===== */
.footnote{
  text-align:center;color:var(--muted);font-size:12px;
  padding:20px 0;margin-top:20px;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.footnote .dot{
  width:8px;height:8px;border-radius:50%;background:#25d366;
  animation:blink 1.5s infinite;
}
@keyframes blink{50%{opacity:.4}}
</style>
</head>
<body>

<div class="wrap">

  <!-- TOP BAR -->
  <div class="topbar">
    <a href="index.html" class="back">
      <i class="fas fa-arrow-left"></i> Kembali ke Website
    </a>
    <div class="brand-mini">
      <div class="brand-mini-dot">
        <img src="favicon/android-chrome-192x192.png" alt="SuruhBoy">
      </div>
      Suruh<span>Boy</span> Admin
    </div>
  </div>

  <!-- PAGE HEADER -->
  <div class="page-header">
    <div class="page-logo">
      <img src="favicon/android-chrome-192x192.png" alt="SuruhBoy">
    </div>
    <div class="page-title">
      <h1>Dashboard <span>Tracking</span></h1>
      <p class="sub">Statistik pengunjung website SuruhBoy — data dari Google Sheets.</p>
    </div>
  </div>

  <!-- REFRESH -->
  <button class="refresh" id="refreshBtn">
    <i class="fas fa-sync"></i> Refresh Data
  </button>

  <!-- CONTENT -->
  <div id="content">
    <div class="loading">
      <i class="fas fa-spinner fa-spin"></i>
      <p>Memuat data…</p>
    </div>
  </div>

  <!-- FOOTNOTE -->
  <div class="footnote">
    <span class="dot"></span>
    Data diambil real-time dari Google Sheets — tanpa cache.
  </div>
</div>

<script>
// ============================================================
// KONFIGURASI — GANTI DENGAN URL APPS SCRIPT KAMU
// ============================================================
const API_URL = 'https://script.google.com/macros/s/AKfycbwkpxZpfSsrqkXtZvaJJL4NaBRU1iSjOV3vr2-VvMdpn-QA8Z6pZMGCornl0Y4q6cvCPQ/exec';

// ============================================================
// UTIL
// ============================================================
const $ = id => document.getElementById(id);
const fmt = n => new Intl.NumberFormat('id-ID').format(n || 0);
const escapeHtml = v => String(v || '')
  .replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');

function showError(msg){
  $('content').innerHTML = `
    <div class="error">
      <b>Gagal memuat data</b>
      ${escapeHtml(msg)}<br><br>
      <small>Cek:</small><br>
      <small>1. URL Apps Script: <code>${escapeHtml(API_URL.slice(0, 50))}…</code></small><br>
      <small>2. Deployment sudah diset <b>"Anyone"</b></small><br>
      <small>3. Sheet name = <code>visits</code></small>
    </div>
  `;
}

// ============================================================
// RENDER DASHBOARD
// ============================================================
function renderDashboard(data){
  const { total = 0, today = 0, yesterday = 0, unique = 0 } = data;
  const pages = data.pages || [];
  const daily = data.daily || [];
  const referrers = data.referrers || [];

  const diff = yesterday > 0
    ? Math.round((today - yesterday) / yesterday * 100)
    : 0;
  const trendIcon = diff >= 0 ? 'fa-arrow-up' : 'fa-arrow-down';
  const trendColor = diff >= 0 ? '#16a34a' : '#dc2626';

  $('content').innerHTML = `
    <div class="kpis">
      <div class="k">
        <span>Total Kunjungan</span>
        <b>${fmt(total)}</b>
        <div class="trend">Sejak tracking aktif</div>
      </div>
      <div class="k">
        <span>Hari Ini</span>
        <b>${fmt(today)}</b>
        <div class="trend" style="color:${trendColor}">
          <i class="fas ${trendIcon}"></i> ${Math.abs(diff)}% dari kemarin
        </div>
      </div>
      <div class="k">
        <span>Kemarin</span>
        <b>${fmt(yesterday)}</b>
        <div class="trend">Kunjungan kemarin</div>
      </div>
      <div class="k">
        <span>Pengunjung Unik</span>
        <b>${fmt(unique)}</b>
        <div class="trend">Session berbeda</div>
      </div>
    </div>

    <div class="card">
      <h3>Tren 30 Hari Terakhir</h3>
      <div class="chart-wrap"><canvas id="trendChart"></canvas></div>
    </div>

    <div class="two">
      <div class="card">
        <h3>Halaman Populer</h3>
        <table>
          <thead>
            <tr>
              <th style="width:36px">#</th>
              <th>Halaman</th>
              <th style="text-align:right">Views</th>
            </tr>
          </thead>
          <tbody>
            ${pages.slice(0, 8).map((p, i) => `
              <tr>
                <td><span class="rank ${i === 0 ? 'r1' : ''}">${i + 1}</span></td>
                <td><b>${escapeHtml(p.path)}</b></td>
                <td style="text-align:right"><b>${fmt(p.count)}</b></td>
              </tr>
            `).join('') || '<tr><td colspan="3" style="text-align:center;color:#999;padding:20px">Belum ada data</td></tr>'}
          </tbody>
        </table>
      </div>

      <div class="card">
        <h3>Sumber Kunjungan</h3>
        <table>
          <thead>
            <tr>
              <th style="width:36px">#</th>
              <th>Sumber</th>
              <th style="text-align:right">Views</th>
            </tr>
          </thead>
          <tbody>
            ${referrers.slice(0, 8).map((r, i) => `
              <tr>
                <td><span class="rank ${i === 0 ? 'r1' : ''}">${i + 1}</span></td>
                <td><b>${escapeHtml(r.source)}</b></td>
                <td style="text-align:right"><b>${fmt(r.count)}</b></td>
              </tr>
            `).join('') || '<tr><td colspan="3" style="text-align:center;color:#999;padding:20px">Belum ada data</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>
  `;

  renderChart(daily);
}

// ============================================================
// CHART
// ============================================================
function renderChart(daily){
  const canvas = $('trendChart');
  if (!canvas) return;

  if (window.__trendChart) {
    window.__trendChart.destroy();
    window.__trendChart = null;
  }

  if (typeof Chart === 'undefined') return;

  const labels = daily.map(d => d.day);
  const values = daily.map(d => d.count);

  Chart.defaults.font.family = "'Plus Jakarta Sans',system-ui,sans-serif";

  window.__trendChart = new Chart(canvas.getContext('2d'), {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Kunjungan',
        data: values,
        borderColor: '#ff7a1a',
        backgroundColor: 'rgba(255,122,26,.08)',
        fill: true,
        tension: 0.35,
        pointRadius: 0,
        pointHoverRadius: 5,
        pointHoverBackgroundColor: '#ff7a1a',
        pointHoverBorderColor: '#fff',
        pointHoverBorderWidth: 2,
        borderWidth: 2.5,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { intersect: false, mode: 'index' },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#0f2a4a',
          padding: 12,
          cornerRadius: 8,
          displayColors: false,
          titleFont: { size: 12, weight: '600' },
          bodyFont: { size: 13, weight: '500' },
          callbacks: {
            label: c => `${fmt(c.raw)} kunjungan`
          }
        }
      },
      scales: {
        x: {
          grid: { display: false },
          ticks: {
            color: '#7a8899',
            font: { size: 11 },
            maxTicksLimit: 8,
          }
        },
        y: {
          beginAtZero: true,
          grid: { color: '#eaeef3' },
          ticks: {
            color: '#7a8899',
            font: { size: 11 },
            precision: 0,
            callback: v => fmt(v),
          }
        }
      }
    }
  });
}

// ============================================================
// FETCH DATA
// ============================================================
async function loadData(){
  const btn = $('refreshBtn');
  btn.classList.add('spin');

  try {
    if (!API_URL || API_URL.includes('PASTE_URL')) {
      throw new Error('URL Apps Script belum diganti. Edit variabel API_URL di baris paling atas script.');
    }

    const res = await fetch(`${API_URL}?action=stats`);
    if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);

    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'API mengembalikan error');

    renderDashboard(data);

  } catch (e) {
    showError(e.message);
  } finally {
    btn.classList.remove('spin');
  }
}

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', () => {

  // Skip tracking kunjungan admin
  sessionStorage.setItem('sb_skip_track', '1');

  // Load Chart.js
  const chartScript = document.createElement('script');
  chartScript.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js';
  chartScript.onload = loadData;
  chartScript.onerror = () => showError('Gagal memuat Chart.js — cek koneksi internet');
  document.head.appendChild(chartScript);

  // Refresh button
  $('refreshBtn').onclick = loadData;
});
</script>
</body>
</html>
