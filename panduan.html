<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SOP — SuruhBoy HQ</title>
<meta name="theme-color" content="#4f46e5">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#4f46e5;--primary-dark:#3730a3;--primary-bg:#eef2ff;
  --success:#10b981;--success-bg:#ecfdf5;--danger:#ef4444;--danger-bg:#fef2f2;
  --info:#3b82f6;--info-bg:#eff6ff;
  --bg:#f1f5f9;--card:#fff;--text:#0f172a;--text2:#475569;--muted:#94a3b8;--border:#e2e8f0;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5}
button,input,textarea,select{font-family:inherit;font-size:14px}
.container{max-width:720px;margin:0 auto;padding:16px}
@media(min-width:768px){.container{max-width:820px;padding:24px}body{font-size:15px}}

.app-header{background:linear-gradient(135deg,#1e1b4b 0%,#4f46e5 100%);color:#fff;padding:24px 20px;border-radius:18px;margin-bottom:16px;position:relative;overflow:hidden}
.app-header::before{content:'';position:absolute;top:-50px;right:-50px;width:180px;height:180px;background:rgba(255,255,255,.08);border-radius:50%}
.app-header::after{content:'';position:absolute;bottom:-70px;right:30px;width:140px;height:140px;background:rgba(255,255,255,.05);border-radius:50%}
.header-content{position:relative;z-index:1}
.app-header h1{font-size:20px;font-weight:800;letter-spacing:-.4px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.app-header p{font-size:13px;opacity:.85}
.header-stats{display:flex;gap:20px;margin-top:16px}
.hstat{display:flex;align-items:center;gap:10px}
.hstat-icon{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:15px}
.hstat-val{font-size:17px;font-weight:800;line-height:1}
.hstat-lbl{font-size:11px;opacity:.75;margin-top:2px}

.toolbar{display:flex;gap:10px;margin-bottom:14px;position:sticky;top:0;z-index:10;padding:8px 0;background:var(--bg)}
.search-wrap{position:relative;flex:1}
.search-wrap i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px}
.search-wrap input{width:100%;padding:12px 14px 12px 42px;border:1px solid var(--border);border-radius:12px;outline:none;background:#fff;font-size:14px}
.search-wrap input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-bg)}
.btn-add{padding:12px 18px;background:var(--primary);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn-add:active{transform:scale(.97)}

.chips{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 15px;background:#fff;border:1px solid var(--border);border-radius:20px;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;white-space:nowrap;flex-shrink:0}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff}

.sop-list{display:flex;flex-direction:column;gap:12px}
.sop-card{background:#fff;border:1px solid var(--border);border-radius:16px;overflow:hidden}
.sop-card-header{padding:16px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;user-select:none}
.sop-num{width:34px;height:34px;border-radius:10px;background:var(--primary-bg);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0}
.sop-title-wrap{flex:1;min-width:0}
.sop-title{font-size:15px;font-weight:700;line-height:1.35;margin-bottom:6px;word-wrap:break-word}
.sop-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.sop-meta span{display:inline-flex;align-items:center;gap:4px}
.sop-toggle{width:30px;height:30px;border-radius:8px;background:var(--bg);border:none;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;transition:.2s}
.sop-toggle.open{transform:rotate(180deg);background:var(--primary-bg);color:var(--primary)}
.sop-body{display:none;padding:0 16px 16px;border-top:1px dashed var(--border)}
.sop-body.open{display:block}
.sop-content{font-size:14px;color:var(--text2);line-height:1.7;white-space:pre-wrap;word-wrap:break-word;padding-top:14px}
.sop-actions{display:flex;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.sop-btn{flex:1;padding:10px;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.sop-btn.edit{background:var(--info-bg);color:var(--info)}
.sop-btn.del{background:var(--danger-bg);color:var(--danger)}

.empty-state{background:#fff;border:2px dashed var(--border);border-radius:16px;padding:50px 20px;text-align:center}
.empty-icon{width:70px;height:70px;border-radius:50%;background:var(--primary-bg);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 16px}
.empty-state h3{font-size:16px;font-weight:700;margin-bottom:6px}
.empty-state p{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:20px}

.loading{padding:40px;text-align:center;color:var(--muted);font-size:13px}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.7);z-index:1000;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.active{display:flex}
.modal{background:#fff;width:100%;max-width:600px;max-height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:slideUp .25s ease-out}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@media(min-width:768px){.modal-overlay{align-items:center}.modal{border-radius:20px;max-height:85vh;animation:zoomIn .2s ease-out}@keyframes zoomIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}}
.modal-header{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:2;border-radius:20px 20px 0 0}
.modal-header h3{font-size:16px;font-weight:800}
.modal-close{width:34px;height:34px;border:none;background:var(--bg);border-radius:10px;cursor:pointer;color:var(--text2);font-size:14px;display:flex;align-items:center;justify-content:center}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-footer{padding:16px 20px;border-top:1px solid var(--border);display:flex;gap:10px;background:#f8fafc;border-radius:0 0 20px 20px}
.modal-footer .btn{flex:1;padding:13px;border-radius:11px;font-size:14px;font-weight:700;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.modal-footer .btn-ghost{background:#fff;color:var(--text2);border:1px solid var(--border)}
.modal-footer .btn-primary{background:var(--primary);color:#fff}
.modal-footer .btn-danger{background:var(--danger);color:#fff}
.modal-footer .btn:disabled{opacity:.6;cursor:not-allowed}

.form-field{margin-bottom:16px}
.form-field label{display:block;font-size:13px;font-weight:700;color:var(--text2);margin-bottom:8px}
.form-field label .req{color:var(--danger)}
.form-field input,.form-field textarea,.form-field select{width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:11px;outline:none;font-size:15px;background:#fff}
.form-field textarea{min-height:180px;resize:vertical;line-height:1.6}
.form-field input:focus,.form-field textarea:focus,.form-field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-bg)}
.form-error{padding:12px 14px;background:var(--danger-bg);color:var(--danger);border-radius:11px;font-size:13px;margin-bottom:16px;display:none}
.form-error.active{display:block}

.toast-container{position:fixed;top:16px;left:16px;right:16px;z-index:2000;pointer-events:none;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#0f172a;color:#fff;padding:13px 20px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:420px;width:100%;display:flex;align-items:center;gap:10px}
.toast.success{background:#065f46}
.toast.error{background:#991b1b}

.fab{display:none;position:fixed;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:var(--primary);color:#fff;border:none;font-size:22px;cursor:pointer;box-shadow:0 8px 20px rgba(79,70,229,.4);z-index:500;align-items:center;justify-content:center}
@media(max-width:600px){.fab{display:flex}.toolbar .btn-add{display:none}}
</style>
</head>
<body>

<div class="container">

  <div class="app-header">
    <div class="header-content">
      <h1><i class="fas fa-book-open"></i> SOP SuruhBoy</h1>
      <p>Standar Operasional Prosedur</p>
      <div class="header-stats">
        <div class="hstat">
          <div class="hstat-icon"><i class="fas fa-file-alt"></i></div>
          <div>
            <div class="hstat-val" id="statTotal">—</div>
            <div class="hstat-lbl">Total SOP</div>
          </div>
        </div>
        <div class="hstat">
          <div class="hstat-icon"><i class="fas fa-tags"></i></div>
          <div>
            <div class="hstat-val" id="statKat">—</div>
            <div class="hstat-lbl">Kategori</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <div class="search-wrap">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="Cari SOP..." oninput="onSearch()">
    </div>
    <button class="btn-add" onclick="openForm('create')">
      <i class="fas fa-plus"></i> Tambah SOP
    </button>
  </div>

  <div class="chips" id="chips"></div>
  <div class="sop-list" id="sopList">
    <div class="loading"><div class="spinner"></div>Memuat SOP...</div>
  </div>

</div>

<button class="fab" onclick="openForm('create')"><i class="fas fa-plus"></i></button>

<!-- MODAL FORM -->
<div class="modal-overlay" id="formModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="formTitle">Tambah SOP</h3>
      <button class="modal-close" onclick="closeForm()"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body">
      <div class="form-error" id="formError"></div>
      <div class="form-field">
        <label>Judul SOP <span class="req">*</span></label>
        <input type="text" id="fJudul" placeholder="cth: Cara Menangani Komplain" maxlength="200">
      </div>
      <div class="form-field">
        <label>Kategori <span class="req">*</span></label>
        <select id="fKategori">
          <option value="CS">CS</option>
          <option value="Agent">Agent</option>
          <option value="Admin">Admin</option>
          <option value="Operasional">Operasional</option>
          <option value="Lainnya" selected>Lainnya</option>
        </select>
      </div>
      <div class="form-field">
        <label>Isi SOP <span class="req">*</span></label>
        <textarea id="fIsi" placeholder="Tulis langkah-langkah SOP di sini..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeForm()">Batal</button>
      <button class="btn btn-primary" id="submitBtn" onclick="submitForm()">
        <i class="fas fa-save"></i> Simpan
      </button>
    </div>
  </div>
</div>

<!-- MODAL DELETE -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal" style="max-width:420px">
    <div class="modal-header">
      <h3>Hapus SOP</h3>
      <button class="modal-close" onclick="closeDelete()"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body">
      <div style="text-align:center;margin-bottom:16px">
        <div style="width:60px;height:60px;border-radius:50%;background:var(--danger-bg);color:var(--danger);display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 12px">
          <i class="fas fa-trash"></i>
        </div>
        <div style="font-size:14px;font-weight:700;margin-bottom:4px" id="delJudul">—</div>
        <div style="font-size:12px;color:var(--muted)">Masukkan password untuk konfirmasi</div>
      </div>
      <div class="form-error" id="delError"></div>
      <div class="form-field">
        <label>Password Hapus <span class="req">*</span></label>
        <input type="password" id="delPassword" placeholder="••••••" onkeydown="if(event.key==='Enter')submitDelete()">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeDelete()">Batal</button>
      <button class="btn btn-danger" id="delBtn" onclick="submitDelete()">
        <i class="fas fa-trash"></i> Hapus
      </button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
/* =========================================================
   ⚠️ GANTI DENGAN URL WEB APP APPS SCRIPT ANDA
========================================================= */
const API_URL = 'https://script.google.com/macros/s/AKfycbwJFmmaSdic2s68kl_YIy2YJZtjcy1ZUi8deiRju4R34qJdm1nBtRuuZerM0aBQfuIoEw/exec';

/* =========================================================
   STATE
========================================================= */
let allSOP = [];
let currentFilter = 'all';
let currentSearch = '';
let editingRow = null;
let deletingRow = null;
let _searchTimer = null;
const KATEGORI_LIST = ['CS','Agent','Admin','Operasional','Lainnya'];

/* =========================================================
   API TRANSPORT
========================================================= */

// GET via JSONP (bypass CORS)
let _jsonpSeq = 0;
function apiGet(action, params) {
  return new Promise(function(resolve, reject) {
    const cbName = '_sop_cb_' + (++_jsonpSeq);
    const timeout = setTimeout(function() {
      delete window[cbName];
      try { document.body.removeChild(script); } catch(_) {}
      reject(new Error('Timeout'));
    }, 15000);

    window[cbName] = function(data) {
      clearTimeout(timeout);
      delete window[cbName];
      try { document.body.removeChild(script); } catch(_) {}
      resolve(data);
    };

    const qs = new URLSearchParams(Object.assign({}, params || {}, {
      action: action,
      callback: cbName
    })).toString();

    const script = document.createElement('script');
    script.src = API_URL + '?' + qs;
    script.onerror = function() {
      clearTimeout(timeout);
      delete window[cbName];
      try { document.body.removeChild(script); } catch(_) {}
      reject(new Error('Gagal koneksi ke server'));
    };
    document.body.appendChild(script);
  });
}

// POST via form-urlencoded (Apps Script tidak support CORS preflight)
async function apiPost(action, payload) {
  const formData = new URLSearchParams();
  formData.append('payload', JSON.stringify(Object.assign({}, payload, { action: action })));

  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: formData.toString()
  });
  return await res.json();
}

/* =========================================================
   LOAD & RENDER
========================================================= */
function loadSOP() {
  const listEl = document.getElementById('sopList');
  listEl.innerHTML = '<div class="loading"><div class="spinner"></div>Memuat SOP...</div>';

  apiGet('list', {})
    .then(function(data) {
      if (data && data.error) {
        listEl.innerHTML = '<div class="loading" style="color:var(--danger)">Gagal: ' + esc(data.error) + '</div>';
        return;
      }
      allSOP = Array.isArray(data) ? data : [];
      updateStats();
      renderChips();
      renderList();
    })
    .catch(function(err) {
      listEl.innerHTML = '<div class="loading" style="color:var(--danger)">Gagal: ' + esc(err.message) + '</div>';
    });
}

function updateStats() {
  document.getElementById('statTotal').textContent = allSOP.length;
  const kats = new Set(allSOP.map(function(s) { return s.kategori; }).filter(Boolean));
  document.getElementById('statKat').textContent = kats.size;
}

function renderChips() {
  const chipsEl = document.getElementById('chips');
  const items = [{key:'all', label:'Semua'}].concat(KATEGORI_LIST.map(function(k) { return {key:k, label:k}; }));
  chipsEl.innerHTML = items.map(function(it) {
    return '<div class="chip ' + (it.key === currentFilter ? 'active' : '') + '" data-key="' + esc(it.key) + '" onclick="setFilter(\'' + esc(it.key) + '\')">' + esc(it.label) + '</div>';
  }).join('');
}

function setFilter(key) {
  currentFilter = key;
  document.querySelectorAll('.chip').forEach(function(el) {
    el.classList.toggle('active', el.dataset.key === key);
  });
  renderList();
}

function onSearch() {
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(function() {
    currentSearch = (document.getElementById('searchInput').value || '').toLowerCase().trim();
    renderList();
  }, 200);
}

function renderList() {
  const listEl = document.getElementById('sopList');
  let list = allSOP.slice();

  if (currentFilter !== 'all') {
    list = list.filter(function(s) { return s.kategori === currentFilter; });
  }
  if (currentSearch) {
    list = list.filter(function(s) {
      return s.judul.toLowerCase().indexOf(currentSearch) !== -1 ||
             s.isi.toLowerCase().indexOf(currentSearch) !== -1;
    });
  }

  if (!list.length) {
    listEl.innerHTML = '<div class="empty-state">' +
      '<div class="empty-icon"><i class="fas fa-inbox"></i></div>' +
      '<h3>' + (allSOP.length === 0 ? 'Belum ada SOP' : 'Tidak ada yang cocok') + '</h3>' +
      '<p>' + (allSOP.length === 0 ? 'Klik tombol "Tambah SOP" untuk mulai menambahkan.' : 'Coba kata kunci lain atau ganti filter.') + '</p>' +
      '<button class="btn-add" style="margin:0 auto" onclick="openForm(\'create\')"><i class="fas fa-plus"></i> Tambah SOP</button>' +
      '</div>';
    return;
  }

  listEl.innerHTML = list.map(function(s, i) {
    return '<div class="sop-card" data-row="' + s.rowNumber + '">' +
      '<div class="sop-card-header" onclick="toggleCard(' + s.rowNumber + ')">' +
        '<div class="sop-num">' + String(i+1).padStart(2,'0') + '</div>' +
        '<div class="sop-title-wrap">' +
          '<div class="sop-title">' + esc(s.judul) + '</div>' +
          '<div class="sop-meta">' +
            (s.timestamp ? '<span><i class="fas fa-calendar"></i> ' + esc(s.timestamp.split(' ')[0]) + '</span>' : '') +
            (s.kategori ? '<span><i class="fas fa-tag"></i> ' + esc(s.kategori) + '</span>' : '') +
          '</div>' +
        '</div>' +
        '<button class="sop-toggle" id="toggle-' + s.rowNumber + '" onclick="event.stopPropagation();toggleCard(' + s.rowNumber + ')">' +
          '<i class="fas fa-chevron-down"></i>' +
        '</button>' +
      '</div>' +
      '<div class="sop-body" id="body-' + s.rowNumber + '">' +
        '<div class="sop-content">' + esc(s.isi) + '</div>' +
        '<div class="sop-actions">' +
          '<button class="sop-btn edit" onclick="openForm(\'edit\', ' + s.rowNumber + ')"><i class="fas fa-pen"></i> Edit</button>' +
          '<button class="sop-btn del" onclick="openDelete(' + s.rowNumber + ')"><i class="fas fa-trash"></i> Hapus</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

function toggleCard(row) {
  const body = document.getElementById('body-' + row);
  const toggle = document.getElementById('toggle-' + row);
  if (!body) return;
  const open = body.classList.toggle('open');
  if (toggle) toggle.classList.toggle('open', open);
}

/* =========================================================
   FORM
========================================================= */
function openForm(mode, row) {
  editingRow = mode === 'edit' ? row : null;
  document.getElementById('formTitle').textContent = mode === 'edit' ? 'Edit SOP' : 'Tambah SOP';
  document.getElementById('formError').classList.remove('active');
  document.getElementById('fJudul').value = '';
  document.getElementById('fKategori').value = 'Lainnya';
  document.getElementById('fIsi').value = '';

  if (mode === 'edit' && row) {
    const sop = allSOP.find(function(s) { return s.rowNumber === row; });
    if (sop) {
      document.getElementById('fJudul').value = sop.judul;
      document.getElementById('fKategori').value = sop.kategori || 'Lainnya';
      document.getElementById('fIsi').value = sop.isi;
    }
  }

  document.getElementById('formModal').classList.add('active');
  setTimeout(function() { document.getElementById('fJudul').focus(); }, 300);
}

function closeForm() {
  document.getElementById('formModal').classList.remove('active');
  editingRow = null;
}

function submitForm() {
  const judul = document.getElementById('fJudul').value.trim();
  const kategori = document.getElementById('fKategori').value;
  const isi = document.getElementById('fIsi').value.trim();
  const errEl = document.getElementById('formError');
  errEl.classList.remove('active');

  if (!judul) return showErr('Judul wajib diisi');
  if (!isi) return showErr('Isi SOP wajib diisi');

  const btn = document.getElementById('submitBtn');
  const orig = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';

  const payload = { judul: judul, kategori: kategori, isi: isi };
  if (editingRow) payload.rowNumber = editingRow;

  apiPost('save', payload)
    .then(function(res) {
      btn.disabled = false;
      btn.innerHTML = orig;
      if (res && res.error) { showErr(res.error); return; }
      closeForm();
      toast('Berhasil disimpan', 'success');
      loadSOP();
    })
    .catch(function(err) {
      btn.disabled = false;
      btn.innerHTML = orig;
      showErr(err.message || 'Gagal menyimpan');
    });

  function showErr(msg) {
    errEl.textContent = msg;
    errEl.classList.add('active');
    btn.disabled = false;
    btn.innerHTML = orig;
  }
}

/* =========================================================
   DELETE
========================================================= */
function openDelete(row) {
  deletingRow = row;
  const sop = allSOP.find(function(s) { return s.rowNumber === row; });
  document.getElementById('delJudul').textContent = sop ? sop.judul : '—';
  document.getElementById('delPassword').value = '';
  document.getElementById('delError').classList.remove('active');
  document.getElementById('deleteModal').classList.add('active');
  setTimeout(function() { document.getElementById('delPassword').focus(); }, 300);
}

function closeDelete() {
  document.getElementById('deleteModal').classList.remove('active');
  deletingRow = null;
}

function submitDelete() {
  const password = document.getElementById('delPassword').value;
  const errEl = document.getElementById('delError');
  errEl.classList.remove('active');

  if (!password) {
    errEl.textContent = 'Password wajib diisi';
    errEl.classList.add('active');
    return;
  }

  const btn = document.getElementById('delBtn');
  const orig = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menghapus...';

  apiPost('delete', { rowNumber: deletingRow, password: password })
    .then(function(res) {
      btn.disabled = false;
      btn.innerHTML = orig;
      if (res && res.error) {
        errEl.textContent = res.error;
        errEl.classList.add('active');
        return;
      }
      closeDelete();
      toast('SOP dihapus', 'success');
      loadSOP();
    })
    .catch(function(err) {
      btn.disabled = false;
      btn.innerHTML = orig;
      errEl.textContent = err.message || 'Gagal menghapus';
      errEl.classList.add('active');
    });
}

/* =========================================================
   UTILS
========================================================= */
function esc(v) {
  return String(v || '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function toast(msg, type) {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast ' + (type || '');
  t.innerHTML = '<i class="fas fa-' + (type === 'error' ? 'times-circle' : 'check-circle') + '"></i> ' + esc(msg);
  c.appendChild(t);
  setTimeout(function() { t.remove(); }, 2500);
}

document.getElementById('formModal').addEventListener('click', function(e) {
  if (e.target === this) closeForm();
});
document.getElementById('deleteModal').addEventListener('click', function(e) {
  if (e.target === this) closeDelete();
});

// INIT
window.addEventListener('DOMContentLoaded', function() {
  renderChips();
  loadSOP();
});
</script>
