<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>SuruhBoy - Order Berjalan</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #F7F9FC;
            min-height: 100vh;
        }

        /* Login Page */
        .login-page {
            min-height: 100vh;
            background: linear-gradient(145deg, #0A0C10 0%, #12161C 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1000;
        }

        .login-card {
            background: white;
            border-radius: 40px;
            width: 100%;
            max-width: 360px;
            padding: 40px 28px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        }

        .login-header { text-align: center; margin-bottom: 32px; }
        .login-icon {
            width: 70px; height: 70px;
            background: linear-gradient(135deg, #FF6B4A, #FF3B2F);
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 36px;
        }
        .login-header h1 { font-size: 28px; font-weight: 800; color: #0F172A; }
        .login-header p { color: #64748B; font-size: 14px; margin-top: 4px; }

        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: #F8FAFE;
            border: 1px solid #E2E8F0;
            border-radius: 20px;
            font-size: 15px;
            font-family: inherit;
        }
        .form-group input:focus {
            outline: none;
            border-color: #FF6B4A;
            box-shadow: 0 0 0 3px rgba(255,107,74,0.1);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #FF6B4A, #FF3B2F);
            border: none;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            cursor: pointer;
        }
        .btn-login:active { transform: scale(0.98); }

        .message {
            padding: 12px;
            border-radius: 20px;
            margin-bottom: 20px;
            font-size: 13px;
            text-align: center;
        }
        .info { background: #EFF6FF; color: #1E40AF; }
        .success { background: #DCFCE7; color: #15803D; }
        .error { background: #FEE2E2; color: #B91C1C; }
        .warning { background: #FEF3C7; color: #92400E; }

        .hidden { display: none; }

        /* Dashboard */
        .dashboard {
            max-width: 550px;
            margin: 0 auto;
            padding: 20px 16px 100px;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .logo-area h2 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #FF6B4A, #FF3B2F);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-area p { font-size: 12px; color: #94A3B8; }

        .user-menu { display: flex; align-items: center; gap: 12px; }
        .user-avatar {
            width: 48px; height: 48px;
            background: linear-gradient(135deg, #FF6B4A, #FF3B2F);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            color: white;
        }
        .logout-icon {
            width: 44px; height: 44px;
            background: #F1F5F9;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748B;
            cursor: pointer;
        }
        .logout-icon:active { background: #E2E8F0; transform: scale(0.95); }

        /* Welcome Card */
        .welcome-card {
            background: linear-gradient(135deg, #0F172A, #1E293B);
            border-radius: 32px;
            padding: 24px;
            margin-bottom: 20px;
            color: white;
        }
        .welcome-text { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
        .welcome-text span {
            background: linear-gradient(135deg, #FF6B4A, #FF3B2F);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .welcome-sub { font-size: 13px; color: #94A3B8; }

        /* Running Orders Card */
        .running-orders-card {
            background: linear-gradient(135deg, #FF6B4A, #FF3B2F);
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 16px;
            color: white;
        }

        .running-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .running-header i {
            font-size: 28px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
            100% { opacity: 1; transform: scale(1); }
        }
        .running-header h3 { font-size: 18px; font-weight: 700; margin: 0; }
        .running-count {
            background: rgba(255,255,255,0.2);
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 24px;
            font-weight: 800;
            margin-left: auto;
        }

        /* Order Item */
        .order-item {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        .order-number {
            font-size: 12px;
            font-family: monospace;
            background: rgba(255,255,255,0.2);
            padding: 4px 10px;
            border-radius: 20px;
        }
        .order-price { font-weight: 800; font-size: 18px; }

        .order-customer {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .customer-name {
            font-weight: 700;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .customer-phone {
            font-size: 12px;
            opacity: 0.8;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .order-desc {
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 12px;
            font-size: 13px;
        }

        .order-location {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
            font-size: 12px;
        }
        .location-item {
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        .location-item i { margin-top: 2px; font-size: 12px; }

        .order-date {
            font-size: 11px;
            opacity: 0.7;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .order-actions {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }
        .btn-action {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 24px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-action:active { transform: scale(0.97); }
        .btn-accept { background: #10B981; color: white; }
        .btn-complete { background: #3B82F6; color: white; }
        .btn-cancel { background: #EF4444; color: white; }

        .empty-running {
            text-align: center;
            padding: 30px;
            opacity: 0.8;
        }

        /* Section Card */
        .section-card {
            background: white;
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid #EDF2F7;
        }
        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: #0F172A;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .refresh-btn {
            background: #F1F5F9;
            border: none;
            padding: 8px 16px;
            border-radius: 24px;
            font-size: 12px;
            cursor: pointer;
            color: #64748B;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .refresh-btn:active { transform: scale(0.95); }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .stat-block {
            background: #F8FAFE;
            border-radius: 20px;
            padding: 14px;
            text-align: center;
        }
        .stat-number { font-size: 24px; font-weight: 800; color: #0F172A; }
        .stat-label { font-size: 11px; color: #64748B; margin-top: 4px; }

        /* History List */
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .history-item {
            background: #F8FAFE;
            border-radius: 20px;
            padding: 14px;
        }
        .history-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .history-customer { font-weight: 700; font-size: 14px; }
        .history-price { font-weight: 700; color: #10B981; }
        .history-detail {
            font-size: 12px;
            color: #64748B;
            display: flex;
            justify-content: space-between;
        }
        .history-action {
            font-size: 11px;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid #E2E8F0;
        }
        .history-action.accept { color: #10B981; }
        .history-action.cancel { color: #EF4444; }
        .history-action.complete { color: #3B82F6; }
        .empty-state { text-align: center; padding: 40px 20px; color: #94A3B8; }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-container {
            background: white;
            border-radius: 32px;
            width: 100%;
            max-width: 320px;
            padding: 24px;
            text-align: center;
        }
        .modal-container i { font-size: 48px; margin-bottom: 16px; }
        .modal-container h3 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
        .modal-container p { color: #64748B; margin-bottom: 20px; }
        .modal-buttons { display: flex; gap: 12px; }
        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
        }
        .modal-btn.confirm {
            background: linear-gradient(135deg, #FF6B4A, #FF3B2F);
            color: white;
        }
        .modal-btn.cancel { background: #F1F5F9; color: #475569; }

        /* Notification */
        .notification-toast {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: #1E293B;
            color: white;
            padding: 16px 20px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1100;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .loading-small { text-align: center; padding: 30px; color: #94A3B8; }
    </style>
</head>
<body>
    <!-- Login Page -->
    <div id="loginPage" class="login-page">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon">🤖</div>
                <h1>SuruhBoy</h1>
                <p>Agent Dashboard</p>
            </div>
            <div class="login-content">
                <div id="loginStatus" class="message info">⏳ Menghubungkan ke database...</div>
                <form id="loginForm">
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="username" placeholder="Masukkan username" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="password" placeholder="Masukkan password" required>
                    </div>
                    <button type="submit" class="btn-login">Masuk</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Agent Dashboard -->
    <div id="agentDashboard" class="dashboard hidden">
        <div class="dashboard-header">
            <div class="logo-area">
                <h2>SuruhBoy</h2>
                <p>Order Berjalan</p>
            </div>
            <div class="user-menu">
                <div class="user-avatar" id="agentAvatar">👤</div>
                <div class="logout-icon" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                </div>
            </div>
        </div>

        <div class="welcome-card">
            <div class="welcome-text">Halo, <span id="agentName"></span></div>
            <div class="welcome-sub">Kelola order yang masuk untuk Anda</div>
        </div>

        <!-- Running Orders Card -->
        <div class="running-orders-card">
            <div class="running-header">
                <i class="fas fa-tasks"></i>
                <h3>Order Berjalan</h3>
                <div class="running-count" id="runningOrderCount">0</div>
            </div>
            <div id="runningOrdersList">
                <div class="empty-running">✨ Tidak ada order berjalan</div>
            </div>
        </div>

        <div class="section-card">
            <div class="section-title">
                <span><i class="fas fa-chart-simple"></i> Ringkasan</span>
                <button class="refresh-btn" onclick="refreshData()">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
            </div>
            <div class="stats-grid">
                <div class="stat-block">
                    <div class="stat-number" id="totalOrders">0</div>
                    <div class="stat-label">Total Order Selesai</div>
                </div>
                <div class="stat-block">
                    <div class="stat-number" id="totalEarnings">Rp0</div>
                    <div class="stat-label">Total Pendapatan</div>
                </div>
            </div>
        </div>

        <div class="section-card">
            <div class="section-title">
                <span><i class="fas fa-history"></i> Riwayat Order</span>
            </div>
            <div id="historyList" class="history-list">
                <div class="empty-state">Belum ada riwayat</div>
            </div>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmModal" class="modal">
        <div class="modal-container">
            <i class="fas fa-question-circle" style="color: #FF6B4A;"></i>
            <h3 id="confirmTitle">Konfirmasi</h3>
            <p id="confirmMessage">Apakah Anda yakin?</p>
            <div class="modal-buttons">
                <button class="modal-btn cancel" onclick="closeConfirmModal()">Batal</button>
                <button class="modal-btn confirm" id="confirmActionBtn">Ya, Lanjutkan</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // KONFIGURASI SHEET
        // ============================================
        const SPREADSHEET_ID = '1FgWiv56J2w7A0WprwqOKJMU7BO4mX3jotW3IC397rWg';
        const ORDER_LOG_SPREADSHEET_ID = '1SPqTzbdLVsgAMBQ79fMInLIs4udTFxGr4c9_wWTwgBg';
        
        // WEB APP URL
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzfybo4oG8ue449-2qu-Vy8UoYFnfeTSwAsXttxK7lO5VnZ2l53ZNXtHJE_qS8yvDRWJQ/exec';
        
        // URL CSV
        const LOGIN_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=Sheet1`;
        const ORDER_CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&gid=896910808`;
        const ORDER_LOG_CSV_URL = `https://docs.google.com/spreadsheets/d/${ORDER_LOG_SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=OrderLog`;
        
        // Variabel Global
        let users = [];
        let currentUser = null;
        let runningOrders = [];
        let completedOrders = [];
        let totalEarnings = 0;
        let pendingAction = null;
        let refreshInterval = null;
        
        // Map untuk menyimpan status dari OrderLog
        let orderStatusMap = new Map();
        
        // ============================================
        // FUNGSI UTILITY
        // ============================================
        function showNotification(message, type = 'info') {
            const existing = document.querySelector('.notification-toast');
            if (existing) existing.remove();
            
            const notif = document.createElement('div');
            notif.className = 'notification-toast';
            const bgColor = type === 'warning' ? '#92400E' : type === 'success' ? '#065F46' : '#1E3A8A';
            notif.style.background = bgColor;
            notif.innerHTML = `
                <i class="fas ${type === 'warning' ? 'fa-exclamation-triangle' : type === 'success' ? 'fa-check-circle' : 'fa-info-circle'}"></i>
                <div style="flex:1">${message}</div>
                <i class="fas fa-times" onclick="this.parentElement.remove()" style="cursor:pointer"></i>
            `;
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), 5000);
        }
        
        function parseCSV(csv) {
            const lines = csv.split(/\r?\n/);
            const data = [];
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                
                const cols = [];
                let current = '';
                let inQuotes = false;
                for (let j = 0; j < line.length; j++) {
                    const char = line[j];
                    if (char === '"') inQuotes = !inQuotes;
                    else if (char === ',' && !inQuotes) {
                        cols.push(current.trim());
                        current = '';
                    } else current += char;
                }
                cols.push(current.trim());
                data.push(cols.map(col => col.replace(/^"|"$/g, '')));
            }
            return data;
        }
        
        // ============================================
        // LOAD STATUS DARI ORDER LOG SHEET
        // ============================================
        async function loadOrderStatusMap() {
            try {
                const response = await fetch(ORDER_LOG_CSV_URL);
                if (!response.ok) throw new Error('Gagal load OrderLog');
                const csv = await response.text();
                const logData = parseCSV(csv);
                
                // Reset map
                orderStatusMap.clear();
                
                // Kolom B (index 1) = Nomor Pesanan
                // Kolom E (index 4) = Action / Status
                for (const row of logData) {
                    const orderNumber = row[1];
                    const status = row[4];
                    if (orderNumber && status) {
                        orderStatusMap.set(orderNumber, status);
                    }
                }
                
                console.log('OrderStatusMap loaded:', orderStatusMap.size, 'entries');
                return true;
            } catch (error) {
                console.error('Error loading OrderLog:', error);
                return false;
            }
        }
        
        // ============================================
        // LOAD USERS (LOGIN)
        // ============================================
        async function loadUsers() {
            const statusDiv = document.getElementById('loginStatus');
            try {
                const response = await fetch(LOGIN_URL);
                const text = await response.text();
                const jsonString = text.match(/({.*})/)[1];
                const data = JSON.parse(jsonString);
                const rows = data.table.rows;
                const cols = data.table.cols;
                
                let nameIdx = 0, usernameIdx = 1, passwordIdx = 2;
                for (let i = 0; i < cols.length; i++) {
                    const label = cols[i].label?.toLowerCase() || '';
                    if (label === 'user' || label === 'nama') nameIdx = i;
                    if (label === 'username') usernameIdx = i;
                    if (label === 'password') passwordIdx = i;
                }
                
                users = [];
                for (let i = 0; i < rows.length; i++) {
                    const row = rows[i].c;
                    if (!row) continue;
                    const name = row[nameIdx]?.v || '';
                    const username = row[usernameIdx]?.v || '';
                    const password = row[passwordIdx]?.v || '';
                    if (username && password && username !== 'Username' && username !== 'username') {
                        users.push({ name: String(name), username: String(username).toLowerCase(), password: String(password) });
                    }
                }
                statusDiv.innerHTML = '✅ Siap login';
                statusDiv.className = 'message success';
            } catch (error) {
                statusDiv.innerHTML = '❌ Gagal mengambil data login';
                statusDiv.className = 'message error';
            }
        }
        
        function login(username, password) {
            return users.find(u => u.username === username.toLowerCase() && u.password === password);
        }
        
        // ============================================
        // LOAD ORDER (BACA DARI ORDER LOG UNTUK STATUS)
        // ============================================
        async function loadOrders() {
            if (!currentUser) return;
            
            try {
                showNotification('🔄 Memuat order...', 'info');
                
                // Load status dari OrderLog terlebih dahulu
                await loadOrderStatusMap();
                
                // Load data order dari sheet utama
                const response = await fetch(ORDER_CSV_URL);
                if (!response.ok) throw new Error('Gagal load data');
                const csv = await response.text();
                const allOrders = parseCSV(csv);
                
                // Reset arrays
                const newRunningOrders = [];
                const newCompletedOrders = [];
                let newTotalEarnings = 0;
                
                for (const order of allOrders) {
                    const agentName = order[8];      // Kolom I (index 8) = Nama Agent
                    
                    // Hanya untuk agent yang login
                    if (agentName !== currentUser.name) continue;
                    
                    const orderNumber = order[16];     // Kolom Q (index 16) = Nomor Pesanan
                    
                    // CEK STATUS DARI ORDER LOG MAP (menimpa status dari sheet utama)
                    let status = orderStatusMap.get(orderNumber);
                    
                    // Jika tidak ada di OrderLog, gunakan status dari sheet utama
                    if (!status) {
                        status = (order[17] || '').trim(); // Kolom R (index 17)
                    }
                    
                    const isCompleted = status === 'Selesai' || status === 'Batal';
                    const isRunning = status === 'Orderan Masuk' || status === 'Diterima' || (!status && order[17] === 'Orderan Masuk');
                    
                    const orderData = {
                        orderNumber: orderNumber,
                        tanggal: order[2],           // Kolom C = Tanggal
                        customerName: order[3],      // Kolom D = Nama
                        customerPhone: order[4],     // Kolom E = Nomor HP
                        description: order[5],       // Kolom F = Deskripsi
                        pickUpPoint: order[6],       // Kolom G = Titik Jemput
                        dropOffPoint: order[7],      // Kolom H = Titik Antar
                        price: parseInt(order[1]?.replace(/[^0-9-]/g, '')) || 0,
                        status: status
                    };
                    
                    // Order berjalan: status "Orderan Masuk" atau "Diterima"
                    if (status === 'Orderan Masuk' || status === 'Diterima') {
                        newRunningOrders.push(orderData);
                    } 
                    // Order selesai/batal masuk riwayat
                    else if (status === 'Selesai' || status === 'Batal') {
                        newCompletedOrders.push(orderData);
                        if (status === 'Selesai') {
                            newTotalEarnings += orderData.price;
                        }
                    }
                }
                
                runningOrders = newRunningOrders;
                completedOrders = newCompletedOrders;
                totalEarnings = newTotalEarnings;
                
                updateRunningOrdersDisplay();
                updateStatsDisplay();
                updateHistoryDisplay();
                
                showNotification(`✅ ${runningOrders.length} order berjalan`, 'success');
                
            } catch (error) {
                console.error(error);
                showNotification('❌ Gagal memuat order', 'warning');
            }
        }
        
        function updateRunningOrdersDisplay() {
            const container = document.getElementById('runningOrdersList');
            const countSpan = document.getElementById('runningOrderCount');
            
            if (!runningOrders.length) {
                container.innerHTML = '<div class="empty-running">✨ Tidak ada order berjalan</div>';
                countSpan.innerText = '0';
                return;
            }
            
            countSpan.innerText = runningOrders.length;
            container.innerHTML = runningOrders.map(order => `
                <div class="order-item">
                    <div class="order-header">
                        <span class="order-number"><i class="fas fa-hashtag"></i> ${order.orderNumber || '-'}</span>
                        <span class="order-price">Rp${order.price.toLocaleString()}</span>
                    </div>
                    <div class="order-customer">
                        <span class="customer-name"><i class="fas fa-user"></i> ${order.customerName || '-'}</span>
                        <span class="customer-phone"><i class="fas fa-phone"></i> ${order.customerPhone || '-'}</span>
                    </div>
                    <div class="order-desc">
                        <i class="fas fa-align-left"></i> ${order.description || 'Tidak ada deskripsi'}
                    </div>
                    <div class="order-location">
                        <div class="location-item">
                            <i class="fas fa-map-marker-alt"></i>
                            <span><strong>Jemput:</strong> ${order.pickUpPoint || '-'}</span>
                        </div>
                        <div class="location-item">
                            <i class="fas fa-flag-checkered"></i>
                            <span><strong>Antar:</strong> ${order.dropOffPoint || '-'}</span>
                        </div>
                    </div>
                    <div class="order-date">
                        <i class="fas fa-calendar-alt"></i> ${order.tanggal || '-'}
                    </div>
                    <div class="order-actions">
                        <button class="btn-action btn-accept" onclick="openConfirmModal('${order.orderNumber}', 'Diterima')">
                            <i class="fas fa-check"></i> Diterima
                        </button>
                        <button class="btn-action btn-complete" onclick="openConfirmModal('${order.orderNumber}', 'Selesai')">
                            <i class="fas fa-flag-checkered"></i> Selesai
                        </button>
                        <button class="btn-action btn-cancel" onclick="openConfirmModal('${order.orderNumber}', 'Batal')">
                            <i class="fas fa-times"></i> Batal
                        </button>
                    </div>
                </div>
            `).join('');
        }
        
        function updateStatsDisplay() {
            const completedCount = completedOrders.filter(o => o.status === 'Selesai').length;
            document.getElementById('totalOrders').innerText = completedCount;
            document.getElementById('totalEarnings').innerHTML = `Rp${totalEarnings.toLocaleString()}`;
        }
        
        function updateHistoryDisplay() {
            const container = document.getElementById('historyList');
            const historyOrders = completedOrders.filter(o => o.status === 'Selesai' || o.status === 'Batal');
            
            if (!historyOrders.length) {
                container.innerHTML = '<div class="empty-state">Belum ada riwayat order</div>';
                return;
            }
            
            container.innerHTML = historyOrders.map(order => {
                let actionClass = '';
                let actionIcon = '';
                let actionText = '';
                
                if (order.status === 'Selesai') {
                    actionClass = 'complete';
                    actionIcon = 'fa-check-circle';
                    actionText = 'Selesai';
                } else if (order.status === 'Batal') {
                    actionClass = 'cancel';
                    actionIcon = 'fa-times-circle';
                    actionText = 'Dibatalkan';
                } else {
                    actionClass = 'accept';
                    actionIcon = 'fa-check';
                    actionText = 'Diterima';
                }
                
                return `
                    <div class="history-item">
                        <div class="history-header">
                            <span class="history-customer"><i class="fas fa-user"></i> ${order.customerName || '-'}</span>
                            <span class="history-price">Rp${order.price.toLocaleString()}</span>
                        </div>
                        <div class="history-detail">
                            <span><i class="fas fa-hashtag"></i> ${order.orderNumber || '-'}</span>
                            <span><i class="fas fa-calendar"></i> ${order.tanggal || '-'}</span>
                        </div>
                        <div class="history-action ${actionClass}">
                            <i class="fas ${actionIcon}"></i> ${actionText}
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // ============================================
        // UPDATE STATUS VIA WEB APP
        // ============================================
        function openConfirmModal(orderNumber, action) {
            pendingAction = { orderNumber, action };
            document.getElementById('confirmTitle').innerText = 'Konfirmasi';
            document.getElementById('confirmMessage').innerHTML = `Apakah Anda yakin ingin <strong>${action}</strong> order #${orderNumber}?`;
            document.getElementById('confirmModal').style.display = 'flex';
        }
        
        function closeConfirmModal() {
            document.getElementById('confirmModal').style.display = 'none';
            pendingAction = null;
        }
        
        async function executeAction() {
            if (!pendingAction) return;
            
            const { orderNumber, action } = pendingAction;
            closeConfirmModal();
            
            showNotification(`🔄 Memproses ${action}...`, 'info');
            
            try {
                const params = new URLSearchParams();
                params.append('type', 'updateOrderStatus');
                params.append('orderNumber', orderNumber);
                params.append('action', action);
                params.append('namaAgent', currentUser.name);
                params.append('username', currentUser.username);
                params.append('timestamp', new Date().toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' }));
                
                const response = await fetch(`${WEB_APP_URL}?${params.toString()}`, { method: 'GET' });
                const result = await response.json();
                
                if (result.status === 'success') {
                    showNotification(`✅ Order ${action} berhasil!`, 'success');
                    // Refresh data setelah update
                    setTimeout(() => loadOrders(), 1000);
                } else {
                    showNotification(`❌ ${result.message || 'Gagal update order'}`, 'warning');
                }
                
            } catch (error) {
                console.error(error);
                showNotification(`❌ Gagal ${action} order`, 'warning');
            }
        }
        
        document.getElementById('confirmActionBtn').onclick = executeAction;
        
        window.refreshData = function() {
            loadOrders();
        };
        
        // ============================================
        // AUTO REFRESH & DASHBOARD
        // ============================================
        function startAutoRefresh() {
            if (refreshInterval) clearInterval(refreshInterval);
            refreshInterval = setInterval(() => {
                if (currentUser) {
                    loadOrders();
                }
            }, 30000);
        }
        
        function stopAutoRefresh() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
                refreshInterval = null;
            }
        }
        
        async function showAgentDashboard() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('agentDashboard').classList.remove('hidden');
            document.getElementById('agentAvatar').innerText = currentUser.name.charAt(0).toUpperCase();
            document.getElementById('agentName').innerText = currentUser.name;
            
            await loadOrders();
            startAutoRefresh();
        }
        
        async function logout() {
            stopAutoRefresh();
            currentUser = null;
            runningOrders = [];
            completedOrders = [];
            totalEarnings = 0;
            orderStatusMap.clear();
            
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('agentDashboard').classList.add('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }
        
        // Login Handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const found = login(username, password);
            
            if (found) {
                currentUser = found;
                showAgentDashboard();
            } else {
                alert('❌ Login gagal! Username atau password salah.');
            }
        });
        
        loadUsers();
    </script>
</body>
</html>
