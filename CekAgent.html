<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>SuruhBoy - Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #F7F9FC;
            min-height: 100vh;
        }

        .login-page {
            min-height: 100vh;
            background: linear-gradient(145deg, #0A0C10 0%, #12161C 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1000;
        }

        .login-card {
            background: white;
            border-radius: 40px;
            width: 100%;
            max-width: 360px;
            padding: 40px 28px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        }

        .login-header { text-align: center; margin-bottom: 32px; }
        .login-icon {
            width: 70px; height: 70px;
            background: linear-gradient(135deg, #FF6B4A, #FF3B2F);
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 36px;
        }
        .login-header h1 { font-size: 28px; font-weight: 800; color: #0F172A; }
        .login-header p { color: #64748B; font-size: 14px; margin-top: 4px; }

        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: #F8FAFE;
            border: 1px solid #E2E8F0;
            border-radius: 20px;
            font-size: 15px;
            font-family: inherit;
        }
        .form-group input:focus {
            outline: none;
            border-color: #FF6B4A;
            box-shadow: 0 0 0 3px rgba(255,107,74,0.1);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #FF6B4A, #FF3B2F);
            border: none;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            cursor: pointer;
        }
        .btn-login:active { transform: scale(0.98); }

        .message {
            padding: 12px;
            border-radius: 20px;
            margin-bottom: 20px;
            font-size: 13px;
            text-align: center;
        }
        .info { background: #EFF6FF; color: #1E40AF; }
        .success { background: #DCFCE7; color: #15803D; }
        .error { background: #FEE2E2; color: #B91C1C; }

        .hidden { display: none; }

        .admin-dashboard { max-width: 800px; margin: 0 auto; padding: 20px 16px 100px; }
        
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .logo-area h2 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #FF6B4A, #FF3B2F);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-area p { font-size: 12px; color: #94A3B8; }
        .user-menu { display: flex; align-items: center; gap: 12px; }
        .user-avatar {
            width: 48px; height: 48px;
            background: linear-gradient(135deg, #FF6B4A, #FF3B2F);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            color: white;
        }
        .logout-icon {
            width: 44px; height: 44px;
            background: #F1F5F9;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748B;
            cursor: pointer;
        }
        .logout-icon:active { background: #E2E8F0; transform: scale(0.95); }

        .admin-title { margin-bottom: 20px; }
        .admin-title h2 { font-size: 24px; font-weight: 700; color: #0F172A; }
        .admin-title p { color: #64748B; }

        .stats-card {
            background: white;
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #EDF2F7;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stats-card .total {
            font-size: 32px;
            font-weight: 800;
            color: #FF6B4A;
        }
        .refresh-btn {
            background: #F1F5F9;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .refresh-btn:active { transform: scale(0.96); background: #E2E8F0; }

        .agent-list-card {
            background: white;
            border-radius: 28px;
            padding: 20px;
            border: 1px solid #EDF2F7;
        }

        .agent-item-admin {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid #F1F5F9;
            position: relative;
        }
        .agent-item-admin:last-child { border-bottom: none; }
        .agent-info h4 { font-size: 16px; font-weight: 700; color: #0F172A; }
        .agent-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-online { background: #DCFCE7; color: #15803D; }
        .agent-areas { font-size: 12px; color: #64748B; margin-top: 4px; }
        .agent-last-active { font-size: 11px; color: #94A3B8; margin-top: 2px; }
        
        .burger-menu {
            position: relative;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 40px;
            background: #F8FAFE;
        }
        .burger-menu:hover { background: #E2E8F0; }
        .burger-icon { font-size: 18px; color: #64748B; }
        .dropdown-menu {
            position: absolute;
            right: 0;
            top: 45px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.15);
            min-width: 170px;
            z-index: 1000;
            overflow: hidden;
            display: none;
            border: 1px solid #E2E8F0;
        }
        .dropdown-menu.show { display: block; }
        .dropdown-item {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 13px;
            color: #334155;
        }
        .dropdown-item:hover { background: #F8FAFE; }
        .dropdown-item i { width: 20px; color: #FF6B4A; }

        .assign-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .assign-modal-content {
            background: white;
            border-radius: 32px;
            width: 100%;
            max-width: 380px;
            padding: 24px;
        }
        .assign-modal-content h3 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .assign-modal-content p {
            font-size: 14px;
            color: #64748B;
            margin-bottom: 20px;
        }
        .area-check-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
            max-height: 300px;
            overflow-y: auto;
        }
        .area-check {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .area-check input { width: 18px; height: 18px; accent-color: #FF6B4A; cursor: pointer; }
        .area-check span { font-size: 14px; color: #334155; cursor: pointer; }
        .modal-buttons {
            display: flex;
            gap: 12px;
        }
        .btn-assign-confirm {
            flex: 2;
            background: linear-gradient(135deg, #FF6B4A, #FF3B2F);
            border: none;
            padding: 12px;
            border-radius: 40px;
            font-weight: 600;
            color: white;
            cursor: pointer;
        }
        .btn-assign-cancel {
            flex: 1;
            background: #F1F5F9;
            border: none;
            padding: 12px;
            border-radius: 40px;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94A3B8;
        }
        .empty-state i { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
        .loading-small { text-align: center; padding: 40px; color: #94A3B8; }
    </style>
</head>
<body>
    <div id="loginPage" class="login-page">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon">🤖</div>
                <h1>SuruhBoy</h1>
                <p>Admin Dashboard</p>
            </div>
            <div class="login-content">
                <div id="loginStatus" class="message info">⏳ Menghubungkan ke database...</div>
                <form id="loginForm">
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="username" placeholder="Masukkan username" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="password" placeholder="Masukkan password" required>
                    </div>
                    <button type="submit" class="btn-login">Masuk sebagai Admin</button>
                </form>
            </div>
        </div>
    </div>

    <div id="adminDashboard" class="admin-dashboard hidden">
        <div class="dashboard-header">
            <div class="logo-area">
                <h2>SuruhBoy Admin</h2>
                <p>Monitor Agent Online</p>
            </div>
            <div class="user-menu">
                <div class="user-avatar" id="adminAvatar">👤</div>
                <div class="logout-icon" onclick="logout()"><i class="fas fa-sign-out-alt"></i></div>
            </div>
        </div>

        <div class="admin-title">
            <h2>👥 Agent Online</h2>
            <p>Daftar agent yang sedang aktif dan siap kerja</p>
        </div>

        <div class="stats-card">
            <div>
                <span style="color:#64748B; font-size:14px;">Total Agent Online</span>
                <div class="total" id="totalOnline">0</div>
            </div>
            <button class="refresh-btn" onclick="refreshData()">
                <i class="fas fa-sync-alt"></i> Refresh
            </button>
        </div>

        <div class="agent-list-card">
            <div id="adminAgentList" class="agent-list">
                <div class="loading-small"><i class="fas fa-spinner fa-pulse"></i> Memuat data agent online...</div>
            </div>
        </div>
    </div>

    <div id="assignModal" class="assign-modal">
        <div class="assign-modal-content">
            <h3><i class="fas fa-map-marker-alt"></i> Assign Area</h3>
            <p id="assignAgentName">Pilih area untuk agent</p>
            <div class="area-check-group" id="assignAreaList"></div>
            <div class="modal-buttons">
                <button class="btn-assign-confirm" onclick="confirmAssign()">Assign</button>
                <button class="btn-assign-cancel" onclick="closeAssignModal()">Batal</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // KONFIGURASI
        // ============================================
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyEyzeBKEsP_6PuAJDnuFmeqq0LBNNnIs97fnfQ6HZ_dpiUgrX9wdD0LNvbSyMKw0l06g/exec';
        const SPREADSHEET_ID_LOGIN = '1FgWiv56J2w7A0WprwqOKJMU7BO4mX3jotW3IC397rWg';
        const AGENT_STATUS_GID = '1931290882';
        const AGENT_STATUS_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID_LOGIN}/gviz/tq?tqx=out:json&gid=${AGENT_STATUS_GID}`;
        const LOGIN_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID_LOGIN}/gviz/tq?tqx=out:json&sheet=Sheet1`;
        const KECAMATAN = ["Ampel","Andong","Banyudono","Boyolali Kota","Cepogo","Juwangi","Karanggede","Kemusu","Klego","Mojosongo","Musuk","Ngemplak","Nogosari","Sambi","Sawit","Selo","Simo","Tamansari","Teras","Wonosegoro"];
        
        let users = [], currentUser = null, isAdmin = false, onlineAgents = [], selectedAgentForAssign = null;
        
        async function saveOnlineLog(namaAgent, username, action, areas) {
            try {
                const params = new URLSearchParams();
                params.append('type', 'online');
                params.append('timestamp', new Date().toLocaleString('id-ID'));
                params.append('namaAgent', namaAgent);
                params.append('username', username);
                params.append('action', action);
                params.append('areas', areas || '-');
                await fetch(`${WEB_APP_URL}?${params.toString()}`, { method: 'GET', mode: 'no-cors' });
                return true;
            } catch(e) { return false; }
        }
        
        async function loadAgentStatusFromSheet() {
            try {
                const response = await fetch(AGENT_STATUS_URL);
                const text = await response.text();
                const jsonString = text.match(/({.*})/)[1];
                const data = JSON.parse(jsonString);
                const rows = data.table.rows, cols = data.table.cols;
                
                let tsIdx=0, nameIdx=1, userIdx=2, actIdx=3, areaIdx=4;
                for(let i=0;i<cols.length;i++){
                    const l = cols[i].label?.toLowerCase() || '';
                    if(l==='timestamp') tsIdx=i;
                    if(l==='nama agent') nameIdx=i;
                    if(l==='username') userIdx=i;
                    if(l==='action') actIdx=i;
                    if(l==='areas') areaIdx=i;
                }
                
                const allStatus = [];
                for(let i=0;i<rows.length;i++){
                    const row = rows[i].c;
                    if(!row) continue;
                    const ts = row[tsIdx]?.v || '';
                    const name = row[nameIdx]?.v || '';
                    const uname = row[userIdx]?.v || '';
                    const act = row[actIdx]?.v || '';
                    let areas = row[areaIdx]?.v || '';
                    if(name && uname && act){
                        let arr = [];
                        if(areas){
                            try{ arr = areas.startsWith('[') ? JSON.parse(areas) : areas.split(',').map(a=>a.trim()).filter(a=>a); }
                            catch(e){ arr = areas.split(',').map(a=>a.trim()).filter(a=>a); }
                        }
                        allStatus.push({ timestamp:ts, namaAgent:String(name), username:String(uname), action:String(act).toLowerCase(), areas:arr });
                    }
                }
                
                const latest = new Map();
                allStatus.forEach(s=>{
                    const ex = latest.get(s.username);
                    if(!ex || s.timestamp > ex.timestamp) latest.set(s.username, s);
                });
                
                onlineAgents = [];
                for(const [uname, s] of latest){
                    if(s.action === 'online' || s.action === 'available'){
                        onlineAgents.push({ username:s.username, namaAgent:s.namaAgent, areas:s.areas, lastActive:s.timestamp });
                    }
                }
                onlineAgents.sort((a,b)=>new Date(b.lastActive)-new Date(a.lastActive));
                return true;
            } catch(e){ console.error(e); return false; }
        }
        
        async function loadUsers() {
            const statusDiv = document.getElementById('loginStatus');
            try {
                const res = await fetch(LOGIN_URL);
                const text = await res.text();
                const json = JSON.parse(text.match(/({.*})/)[1]);
                const rows = json.table.rows, cols = json.table.cols;
                let nIdx=0, uIdx=1, pIdx=2;
                for(let i=0;i<cols.length;i++){
                    const l = cols[i].label?.toLowerCase() || '';
                    if(l==='user') nIdx=i;
                    if(l==='username') uIdx=i;
                    if(l==='password') pIdx=i;
                }
                users = [];
                for(let i=0;i<rows.length;i++){
                    const row = rows[i].c;
                    if(!row) continue;
                    const name = row[nIdx]?.v || '';
                    const uname = row[uIdx]?.v || '';
                    const pass = row[pIdx]?.v || '';
                    if(uname && pass && uname!=='Username') users.push({ name:String(name), username:String(uname).toLowerCase(), password:String(pass) });
                }
                statusDiv.innerHTML = '✅ Siap login';
                statusDiv.className = 'message success';
            } catch(e){ statusDiv.innerHTML = '❌ Gagal ambil data'; statusDiv.className = 'message error'; }
        }
        
        function login(username, password){ return users.find(u=>u.username===username.toLowerCase() && u.password===password); }
        function isAdminUser(u){ return u.username==='admin' || u.name==='Admin Suruhboy' || u.username==='adminsuruhboy'; }
        
        function renderAgentList() {
            const container = document.getElementById('adminAgentList');
            document.getElementById('totalOnline').innerText = onlineAgents.length;
            if(onlineAgents.length===0){
                container.innerHTML = '<div class="empty-state"><i class="fas fa-user-clock"></i><div>Tidak ada agent online</div></div>';
                return;
            }
            container.innerHTML = onlineAgents.map((a,i)=>`
                <div class="agent-item-admin" data-agent-idx="${i}">
                    <div class="agent-info">
                        <h4><i class="fas fa-user-circle"></i> ${escapeHtml(a.namaAgent)}</h4>
                        <div class="agent-areas"><i class="fas fa-map-marker-alt"></i> Area: ${escapeHtml(a.areas?.length ? a.areas.join(', ') : '-')}</div>
                        <div class="agent-last-active"><i class="fas fa-clock"></i> Online sejak: ${escapeHtml(new Date(a.lastActive).toLocaleString('id-ID'))}</div>
                    </div>
                    <div style="display:flex; align-items:center; gap:12px;">
                        <span class="agent-status status-online"><i class="fas fa-circle"></i> Online</span>
                        <div class="burger-menu" data-agent-name="${escapeHtml(a.namaAgent)}" data-agent-username="${escapeHtml(a.username)}" data-areas='${JSON.stringify(a.areas)}'>
                            <i class="fas fa-ellipsis-v burger-icon"></i>
                        </div>
                        <div class="dropdown-menu" id="dropdown-${i}" style="display:none;">
                            <div class="dropdown-item" data-action="offline" data-agent-name="${escapeHtml(a.namaAgent)}" data-agent-username="${escapeHtml(a.username)}">
                                <i class="fas fa-power-off"></i> Offline-kan Agent
                            </div>
                            <div class="dropdown-item" data-action="assign" data-agent-name="${escapeHtml(a.namaAgent)}" data-agent-username="${escapeHtml(a.username)}" data-areas='${JSON.stringify(a.areas)}'>
                                <i class="fas fa-map-marker-alt"></i> Assign Area
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
            
            // Attach event listeners ke burger menu
            document.querySelectorAll('.burger-menu').forEach((burger, idx) => {
                burger.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const dropdown = document.getElementById(`dropdown-${idx}`);
                    // Tutup semua dropdown lain
                    document.querySelectorAll('.dropdown-menu').forEach(menu => {
                        if(menu !== dropdown) menu.style.display = 'none';
                    });
                    dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
                });
            });
            
            // Attach event listeners ke dropdown items
            document.querySelectorAll('.dropdown-item').forEach(item => {
                item.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const action = item.getAttribute('data-action');
                    const agentName = item.getAttribute('data-agent-name');
                    const agentUsername = item.getAttribute('data-agent-username');
                    const areasStr = item.getAttribute('data-areas');
                    const areas = areasStr ? JSON.parse(areasStr) : [];
                    
                    if(action === 'offline'){
                        if(confirm(`Offline-kan agent ${agentName}?`)){
                            await saveOnlineLog(agentName, agentUsername, 'Offline (by admin)', '-');
                            localStorage.setItem(`suruhboy_agent_status_${agentUsername}`, JSON.stringify({ status:'offline', areas:[], timestamp:new Date().toISOString(), forcedByAdmin:true }));
                            await refreshData();
                            alert(`✅ Agent ${agentName} telah di-offline-kan`);
                        }
                    } else if(action === 'assign'){
                        selectedAgentForAssign = { name: agentName, username: agentUsername, areas: areas };
                        const modal = document.getElementById('assignModal');
                        const areaList = document.getElementById('assignAreaList');
                        document.getElementById('assignAgentName').innerHTML = `Assign area untuk <strong>${escapeHtml(agentName)}</strong>`;
                        areaList.innerHTML = KECAMATAN.map(k => `
                            <label class="area-check">
                                <input type="checkbox" value="${k}" ${areas.includes(k) ? 'checked' : ''}>
                                <span>${k}</span>
                            </label>
                        `).join('');
                        modal.style.display = 'flex';
                    }
                    
                    // Tutup dropdown setelah klik
                    item.closest('.dropdown-menu').style.display = 'none';
                });
            });
        }
        
        function escapeHtml(str){ if(!str) return ''; return str.replace(/[&<>]/g, m=>{ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m; }); }
        
        window.closeAssignModal = function(){ document.getElementById('assignModal').style.display = 'none'; selectedAgentForAssign = null; };
        window.confirmAssign = async function(){
            if(!selectedAgentForAssign) return;
            const selected = [];
            document.querySelectorAll('#assignAreaList input:checked').forEach(cb => selected.push(cb.value));
            const action = selected.length > 0 ? 'Online (assigned by admin)' : 'Offline (assigned by admin)';
            const areasText = selected.length > 0 ? selected.join(', ') : '-';
            await saveOnlineLog(selectedAgentForAssign.name, selectedAgentForAssign.username, action, areasText);
            localStorage.setItem(`suruhboy_agent_status_${selectedAgentForAssign.username}`, JSON.stringify({ status:selected.length>0?'available':'offline', areas:selected, timestamp:new Date().toISOString(), assignedByAdmin:true }));
            await refreshData();
            closeAssignModal();
            alert(`✅ Area untuk ${selectedAgentForAssign.name} telah diupdate`);
        };
        
        async function refreshData(){
            const container = document.getElementById('adminAgentList');
            container.innerHTML = '<div class="loading-small"><i class="fas fa-spinner fa-pulse"></i> Memperbarui data...</div>';
            await loadAgentStatusFromSheet();
            renderAgentList();
        }
        
        document.addEventListener('click', function(e) {
            if(!e.target.closest('.burger-menu') && !e.target.closest('.dropdown-menu')){
                document.querySelectorAll('.dropdown-menu').forEach(menu => menu.style.display = 'none');
            }
        });
        
        function updateAdminUI(){ if(currentUser) document.getElementById('adminAvatar').innerText = currentUser.name.charAt(0).toUpperCase(); }
        
        async function showAdminDashboard(){
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('adminDashboard').classList.remove('hidden');
            updateAdminUI();
            await refreshData();
            if(window.adminRefreshInterval) clearInterval(window.adminRefreshInterval);
            window.adminRefreshInterval = setInterval(() => { if(isAdmin && !document.getElementById('loginPage').classList.contains('hidden')===false) refreshData(); }, 15000);
        }
        
        async function logout(){
            if(window.adminRefreshInterval) clearInterval(window.adminRefreshInterval);
            currentUser = null; isAdmin = false;
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('adminDashboard').classList.add('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const found = login(username, password);
            if(found && isAdminUser(found)){ currentUser = found; isAdmin = true; showAdminDashboard(); }
            else if(found) alert('⚠️ Akun ini bukan admin.');
            else alert('❌ Login gagal!');
        });
        
        loadUsers();
    </script>
</body>
</html>
